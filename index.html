e:11px;opacity:.65}.counter{text-align:center;color:rgba(255,255,255,.42);font-size:12px;margin-top:10px}.modal-overlay{animation:fadeIn .2s ease forwards;position:fixed;inset:0;background:rgba(0,8,20,.82);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}.modal-box{animation:slideUp .3s cubic-bezier(.22,1,.36,1) forwards;background:#fff;border-radius:14px;overflow:hidden}.scrollable-modal{max-height:90vh;overflow-y:auto}.form-input{width:100%;padding:9px 10px;border-radius:7px;border:1.5px solid rgba(21,59,115,.34);font-size:13px;font-family:Arial, Helvetica, sans-serif;outline:none;background:#fff;color:#071932}.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,59,115,.1)}.label-sm{display:block;font-size:11px;font-weight:900;color:#071932;margin-bottom:5px;text-transform:uppercase;letter-spacing:.55px}.save-btn{width:100%;margin-top:18px;padding:12px;background:var(--red);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;letter-spacing:1px}.save-btn:hover{background:#a00c24}.delete-btn{padding:10px 14px;background:#fff;color:var(--red);border:2px solid var(--red);border-radius:9px;cursor:pointer;font-weight:bold;font-size:13px}.delete-btn:hover{background:var(--red);color:#fff}.edit-action-btn{flex:1;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}.confirm-box{background:#fff;border-radius:14px;padding:28px;width:310px;text-align:center}@keyframes pasteIn{0%{transform:scale(.1) rotate(15deg) translateY(-30px);opacity:0;filter:blur(6px)}55%{transform:scale(1.07) rotate(-4deg) translateY(0);opacity:1;filter:blur(0)}72%{transform:scale(.96) rotate(2deg)}86%{transform:scale(1.03) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(28px) scale( /* Sticker-Parkplatz */
.parking-closed{position:fixed;left:clamp(12px,1.4vw,22px);bottom:clamp(12px,1.4vw,22px);z-index:120;width:96px;height:72px;border:none;border-radius:10px;background:linear-gradient(135deg,#765f3b,#3b2b18);box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 0 2px rgba(215,169,59,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);transition:transform .18s ease}

.parking-title{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:900;letter-spacing:1px;text-transform:uppercase}
.parking-actions{display:flex;gap:8px;align-items:center}.parking-actions button{border:none;border-radius:999px;cursor:pointer;font-weight:bold}.parking-add{background:var(--blue);color:var(--gold);padding:8px 12px}.parking-close{width:34px;height:34px;background:rgba(21,59,115,.1);color:var(--blue)}
.parking-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,96px));gap:11px;align-items:start}.parking-slot{width:96px;height:132px;position:relative}.parking-slot .sticker-card{font-size:inherit}.parking-empty{border:2px dashed rgba(21,59,115,.32);border-radius:6px;background:rgba(21,59,115,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:rgba(21,59,115,.42);cursor:pointer}.parking-empty:hover{border-color:rgba(215,169,59,.82);background:rgba(215,169,59,.11)}

);background:rgba(215,169,59,.12)}.league-row.active{background:linear-gradient(135deg,var(--gold),#f4d97a);color:var(--blue);border-color:rgba(21,59,115,.3);box-shadow:0 3px 8px rgba(215,169,59,.32)}.league-row.locked{cursor:default}.league-gap{display:flex;align-items:center;gap:6px;margin:2px 0}.league-gap:before,.league-gap:after{content:"";height:1px;flex:1;background:rgba(21,59,115,.12)}.league-year{width:62px;text-align:center;border:1px dashed rgba(21,59,115,.35);border-radius:999px;background:rgba(255,255,255,.7);color:var(--blue);font-size:10px;padding:3px 5px;font-family:Arial, Helvetica, sans-serif;outline:none}.league-year:focus{border-style:solid;border-color:var(--gold);box-shadow:0 0 0 3px rgba(215,169,59,.18)}@media (max-width:1100px){.top-actions{gap:9px}.coach-sticker-mini{width:94px;height:130px}.league-panel{position:relative;right:auto;top:auto;width:100%;margin:10px 0 14px;order:-1}.coach-profile-grid{grid-template-columns:1fr}.coach-frame{height:360px}}

/* Echte Umblätter-Animation: eine einzelne Seite klappt um die Album-Mitte */

.page-flip-overlay{position:fixed;z-index:190;pointer-events:none;perspective:2400px;transform-style:preserve-3d}

.page-flip-next .page-flip-sheet{transform-origin:left center;animation:realPageTurnNext .56s cubic-bezier(.18,.72,.18,1) forwards}
.page-flip-prev .page-flip-sheet{transform-origin:right center;animation:realPageTurnPrev .56s cubic-bezier(.18,.72,.18,1) forwards}
.page-flip-next .page-flip-sheet:after,.page-flip-prev .page-flip-sheet:after{content:"";position:absolute;inset:0;box-shadow:0 20px 45px rgba(0,0,0,.38);border-radius:0;pointer-events:none}

function clubSinceFromCareer(sticker){

    if(m)m.forEach(y=>years.push(parseInt(y,10)));
  };
  if(sticker&&Array.isArray(sticker.careerHistory)){
    sticker.careerHistory.forEach(r=>{
      if(!r||String(r.type||'').toLowerCase()==='total')return;
      addYear(r.year);

tät',escapeHtml(sticker.nationality||'—'))}${profileRow('ti-calendar','Geboren',fmtDate(sticker.birthdate))}${profileRow('ti-id','YI Jahr',escapeHtml(sticker.yiYear||'—'))}${profileRow('ti-trophy','Profidebüt',escapeHtml(sticker.proDebut||'—'))}${profileRow('ti-building','Ausgebildet',escapeHtml(sticker.trainedAt||'—'))}${profileRow('ti-ruler','Größe',escapeHtml(sticker.height||'—'))}${profileRow('ti-hash','Nummer',String(number).padStart(3,'0'))}${profileRow('ti-shirt','Rückennummer',sticker.jerseyNumber?('#'+escapeHtml(sticker.jerseyNumber)):'—')}${profileRow('ti-signature','Spitzname',escapeHtml(sticker.nickname||'—'))}${profileRow('ti-user-heart','Pate',escapeHtml(sticker.patron||'—'))}${profileRow('ti-calendar-heart','Patenschaft seit',escapeHtml(sticker.sponsorshipSince||'—'))}</div><div class="profile-section"><div class="profile-section-title">Status im Kader</div><div style="display:flex;align-items:center;gap:12px;font-size:23px;font-weight:bold;color:var(--blue)">${statusIconHTML(sticker)||'<i class="ti ti-circle-check" style="color:#10b981"></i>'}<span>${statusLabel(sticker)}</span></div></div><div class="profile-section"><div class="profile-section-title">Wechselinformationen</div>${transferRows(sticker,status)}</div><div class="profile-section"><div class="profile-section-title">Notiz</div><div style="white-space:pre-wrap;font-size:19px;line-height:1.5;color:#333;min-height:90px">${escapeHtml(sticker.note||'—')}</div></div></div></div><div style="background:var(--blue);padding:12px 21px;text-align:center"><span style="color:var(--gold);font-size:17px;font-weight:bold;letter-spacing:2.25px">${pos} · CREWE ALEXANDRA FC · ${statusLabel(sticker)}</span></div><div style="padding:15px 20px;display:flex;gap:11px"><button class="edit-action-btn" id="profile-edit-btn" style="font-size:14px;padding:12px"><i class="ti ti-pencil"></i> Bearbeiten</button><button class="delete-btn" id="profile-del-btn" style="font-size:14px;padding:11px 15px"><i class="ti ti-trash"> function profileRow(icon,label,val){return `<div><div class="profile-row-label" style="font-size:11px;color:#071932;font-weight:400;text-transform:uppercase;letter-spacing:.55px;margin-bottom:5px"><i class="ti ${icon}" style="font-size:11px;vertical-align:-1px"></i> ${label}</div><div class="profile-row-value" style="font-size:23px;font-weight:400;color:var(--blue);line-height:1.25">${val}</div></div>`}
function confirmModal(title,msg,id){return `<div class="modal-overlay"><div class="confirm-box modal-box"><i class="ti ti-trash" style="font-size:36px;color:var(--red);margin-bottom:10px"></i><div style="font-size:16px;font-weight:bold;color:var(--blue);margin-bottom:7px">${title}</div><div style="font-size:12px;color:#666;margin-bottom:18px">${msg}</div><div style="display:flex;gap:9px"><button id="confirm-cancel" style="flex:1;padding:9px;background:#f0f0f0;border:none;border-radius:8px;cursor:pointer;font-size:13px">Abbrechen</button><button id="${id}" style="flex:1;padding:9px;background:var(--red);color:white;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold">Löschen</button></div></div></div>`}
function slotDefaultPos(cid){return {keeper:'TW',defenders:'IV',midfield:'ZM',forwards:'MS'}[cid]||'ZM'}
let currentPhoto=null;
function isParkingTarget(t){return !!(t&&t.parking)}
function getSlotArray(t){return isParkingTarget(t)?state.parking:currentSpread().categories[t.cid]}
function getTargetFromEl(el){return el.dataset.parking==='1'?{parking:true,si:+el.dataset.si}:{cid:el.dataset.cid,si:+el.dataset.si}}
function sameTarget(a,b){return !!a&&!!b&&a.parking===b.parking&&a.cid===b.cid&&a.si===b.si}
function targetKey(t){return isParkingTarget(t)?`parking-${t.si}`:`${state.spread}-${t.cid}-${t.si}`}
function attachListeners(){const $=id=>document.getElementById(id);const sp=currentSpread();const findFirstEmpty=()=>{for(const c of CATEGORIES){const i=sp.categories[c.id].findIndex(x=>!x);if(i!==-1)return{cid:c.id,si:i}}return null};
const pt=$('parking-toggle');if(pt)pt.onclick=()=>setState({parkingOpen:true});const pc=$('parking-close');if(pc)pc.onclick=()=>setState({parkingOpen:false});const pas=$('parking-add-slot');if(pas)pas.onclick=()=>{state.parking.push(null);setState({parkingOpen:true});saveState()};

const pp=$('nav-prev');if(pp)pp.onclick=()=>setState({spread:Math.max(0,state.spread-1)});const pn=$('nav-next');if(pn)pn.onclick=()=>setState({spread:Math.min(totalSpreads()-1,state.spread+1)});const as=$('add-spread-btn');if(as)as.onclick=()=>{const ns=[...state.spreads,cloneSpreadFromPrevious(state.nextId++)];setState({spreads:ns,spread:ns.length-1});saveState()};const ds=$('delete-spread-btn');if(ds)ds.onclick=()=>setState({confirmDelSpread:true});
document.querySelectorAll('[data-add-slot]').forEach(btn=>btn.onclick=()=>{const cid=btn.dataset.addSlot;sp.categories[cid]=oneEmptyAfterFilled(sp.categories[cid]);setState({});saveState()});
document.querySelectorAll('[data-empty]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-del-slot]'))return;const t=getTargetFromEl(el);setState({showAdd:true,addTarget:t})});
document.querySelectorAll('[data-del-slot]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const t=getTargetFromEl(btn);if(!isParkingTarget(t))return;const arr=getSlotArray(t);if(arr&&!arr[t.si])setState({confirmDelSlot:t})});
document.querySelectorAll('.sticker-card').forEach(card=>{card.onclick=e=>{if(state.justDropped){state.justDropped=false;return}if(e.target.closest('[data-edit]'))return;const loc=findSticker(+card.dataset.id);if(loc)setState({showProfile:true,profileTarget:loc})};const editIcon=card.querySelector('[data-edit]');if(editIcon)editIcon.onclick=e=>{e.stopPropagation();const loc=findSticker(+card.dataset.id);if(loc)setState({showEdit:true,editTarget:loc,showProfile:false})};card.ondragstart=e=>{const loc=findSticker(+card.dataset.id);if(!loc){e.preventDefault();return}state.dragSrc=isParkingTarget(loc)?{parking:true,si:loc.si}:{cid:loc.cid,si:loc.si};state.isDragging=true;card.classList.add('is-dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(state.dragSrc));try{e.dataTransfer.setDragImage(card,card.offsetWidth/2,card.offsetHeight/2)}catch(_){}};card.ondragend=()=>{document.querySelectorAll('.drag-over-slot').forEach(x=>x.classList.remove('drag-over-slot'));state.dragSrc=null;state.dragOver=null;state.isDragging=false;setTimeout(()=>{state.justDropped=false},80)}});
document.querySelectorAll('[data-drop],[data-empty]').forEach(el=>{el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drag-over-slot').forEach(x=>{if(x!==el)x.classList.remove('drag-over-slot')});el.classList.add('drag-over-slot')};el.ondragenter=e=>{e.preventDefault();el.classList.add('drag-over-slot')};el.ondragleave=e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drag-over-slot')};el.ondrop=e=>{e.preventDefault();e.stopPropagation();document.querySelectorAll('.drag-over-slot').forEach(x=>x.classList.remove('drag-over-slot'));let src=state.dragSrc;try{if(!src){const raw=e.dataTransfer.getData('text/plain');if(raw)src=JSON.parse(raw)}}catch(_){}if(!src)return;const dst=getTargetFromEl(el);if(sameTarget(src,dst)){state.dragSrc=null;state.isDragging=false;return}const srcArr=getSlotArray(src),dstArr=getSlotArray(dst);if(!srcArr||!dstArr)return;const tmp=srcArr[src.si];srcArr[src.si]=dstArr[dst.si];dstArr[dst.si]=tmp;state.dragSrc=null;state.dragOver=null;state.isDragging=false;state.justDropped=true;setState({});saveState()}});
const close=$('close-modal-btn');if(close)close.onclick=()=>setState({showAdd:false,showEdit:false,addTarget:null,editTarget:null});currentPhoto=state.showEdit&&state.editTarget?(state.editTarget.sticker.photo||null):null;const pa=$('photo-area');if(pa)pa.onclick=()=>{$('photo-input')?.click()};const pi=$('photo-input');if(pi)pi.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{currentPhoto=ev.target.result;const area=$('photo-area');if(area)area.innerHTML=`<img src="${currentPhoto}" style="width:100%;height:100%;object-fit:contain;object-position:center;background:var(--photo-bg)">`};reader.readAsDataURL(file)};const rp=$('remove-photo');if(rp)rp.onclick=()=>{currentPhoto=null;const area=$('photo-area');if(area)area.innerHTML='<div style="text-align:center;color:#fff"><i class="ti ti-camera" style="font-size:30px"></i><div style="font-size:10px;margin-top:4px">Foto</div></div>'};const save=$('save-sticker-btn');if(save)save.onclick=()=>{const name=($('f-name')||{}).value?.trim();if(!name)return;const pos=normalizePos(($('f-pos')||{}).value||'TW');const oldSticker=state.showEdit?state.editTarget.sticker:{};const status=($('f-status')||{}).value||'active';const sticker={...oldSticker,id:state.showEdit?state.editTarget.sticker.id:state.nextId++,stickerNo:state.showEdit?(state.editTarget.sticker.stickerNo||state.nextStickerNo++):state.nextStickerNo++,name,nickname:($('f-nickname')||{}).value?.trim()||'',jerseyNumber:(($('f-jersey')||{}).value||'').replace(/\D/g,'').slice(0,3),photo:currentPhoto||(state.showEdit?state.editTarget.sticker.photo:null),position:pos,nationality:($('f-nat')||{}).value||'England',height:($('f-height')||{}).value?.trim()||'',birthdate:($('f-birth')||{}).value||'',yiYear:(($('f-yi-year')||{}).value||'').replace(/\D/g,'').slice(0,4),proDebut:($('f-debut')||{}).value?.trim()||'',trainedAt:($('f-trained')||{}).value?.trim()||'',status,sold:status==='sold',loaned:status==='loan',transferFee:($('f-fee')||{}).value?.trim()||'',leftDate:($('f-left-date')||{}).value||'',buyingClub:($('f-buying-club')||{}).value?.trim()||'',contractExpired:!!($('f-contract-expired')||{}).checked,gamesForClub:($('f-games')||{}).value?.trim()||'',patron:($('f-patron')||{}).value?.trim()||'',sponsorshipSince:($('f-sponsorship-since')||{}).value?.trim()||'',note:($('f-note')||{}).value?.trim()||''};const target=state.showAdd?state.addTarget:state.editTarget;const arr=getSlotArray(target);if(state.showEdit){replaceStickerEverywhere(sticker.id,sticker);}else{arr[target.si]=sticker;}tidyCategoryPlaceholders();const key=state.showAdd?targetKey(target):null;setState({showAdd:false,showEdit:false,addTarget:null,editTarget:null,newKey:key});saveState();if(key)setTimeout(()=>setState({newKey:null}),900)};
const cp=$('close-profile-btn');if(cp)cp.onclick=()=>setState({showProfile:false,profileTarget:null});const pe=$('profile-edit-btn');if(pe)pe.onclick=()=>setState({showEdit:true,editTarget:state.profileTarget,showProfile:false,profileTarget:null});const pd=$('profile-del-btn');if(pd)pd.onclick=()=>setState({confirmDelSticker:true});const cc=$('confirm-cancel');if(cc)cc.onclick=()=>setState({confirmDelSpread:false,confirmDelSticker:false,confirmDelSlot:null});const cds=$('confirm-del-spread');if(cds)cds.onclick=()=>{if(state.spreads.length<=1)return setState({confirmDelSpread:false});const ns=state.spreads.filter((_,i)=>i!==state.spread);setState({spreads:ns,spread:Math.max(0,Math.min(state.spread,ns.length-1)),confirmDelSpread:false});saveState()};const cst=$('confirm-del-sticker');if(cst)cst.onclick=()=>{if(!state.profileTarget)return setState({confirmDelSticker:false});const t=state.profileTarget;const arr=getSlotArray(t);arr[t.si]=null;setState({confirmDelSticker:false,showProfile:false,profileTarget:null});saveState()};const csl=$('confirm-del-slot');if(csl)csl.onclick=()=>{const t=state.confirmDelSlot;if(t){const arr=getSlotArray(t);if(arr&&!arr[t.si])arr.splice(t.si,1)}setState({confirmDelSlot:null});saveState()}}
function findSticker(id){const sp=currentSpread();for(const c of CATEGORIES){for(let si=0;si<sp.categories[c.id].length;si++){const s=sp.categories[c.id][si];if(s&&s.id===id)return{sticker:s,cid:c.id,si}}}for(let si=0;si<(state.parking||[]).length;si++){const s=state.parking[si];if(s&&s.id===id)return{sticker:s,parking:true,si}}return null}

// --- Extra feature layer: coach, league ladder, closed reserve album ---
(function(){
  const LEAGUES=['Premier League','Football League Championship','Football League One','Football League Two'];
  const defaultCoach=()=>({name:'Trainer',photo:null,nationality:'England',birthdate:'',takeoverYear:'2025',home:'',height:'',note:''});
  function ensureExtras(){
    if(!state.coach) state.coach=defaultCoach();
    if(!Array.isArray(state.leagueSeasons)) state.leagueSeasons=[];
    for(let i=0;i<state.spreads.length;i++){
      if(!state.leagueSeasons[i]){
        const prev=state.leagueSeasons[i-1]||{leagueIndex:3,years:{},places:{}};
        state.leagueSeasons[i]={leagueIndex:i===0?3:prev.leagueIndex,years:{...(prev.years||{})},places:{...(prev.places||{})}};
      }
      if(i===0) state.leagueSeasons[i].leagueIndex=3;
      if(!state.leagueSeasons[i].years) state.leagueSeasons[i].years={};
      if(!state.leagueSeasons[i].places) state.leagueSeasons[i].places={};
    }
  }
  const oldLoadState=loadState;
  loadState=async function(){
    await oldLoadState();
    try{const raw=await storageGet('crewe-extra-v2');if(raw){const d=JSON.parse(raw);state.coach={...defaultCoach(),...(d.coach||{})};state.leagueSeasons=Array.isArray(d.leagueSeasons)?d.leagueSeasons:[];}}
    catch(e){}
    ensureExtras();
    render();
  };
  const oldSaveState=saveState;
  saveState=async function(){
    ensureExtras();
    await oldSaveState();
    try{await storageSet('crewe-extra-v2',JSON.stringify({coach:state.coach,leagueSeasons:state.leagueSeasons}));}catch(e){}
  };
  const oldMakeSpread=makeSpread;
  makeSpread=function(id){const sp=oldMakeSpread(id);return sp;};
  const oldRenderParkingAlbum=renderParkingAlbum;
  renderParkingAlbum=function(){
    const arr=state.parking||[];const filled=arr.filter(Boolean).length;
    if(!state.parkingOpen)return `<button id="parking-toggle" class="parking-closed" title="Reserve-Album öffnen"><div class="parking-cover-content">${clubLogo(42)}<div class="parking-cover-title">Reserve<br>Album</div><div class="parking-cover-sub">${filled} Sticker</div></div></button>`;
    return oldRenderParkingAlbum().replace(/Sticker-Parkplatz/g,'Reserve-Album');
  };
  function renderCoachCard(){ensureExtras();const c=state.coach||defaultCoach();const nat=getNat(c.nationality);const age=coachAge(c,state.spread);return `<div id="coach-card" class="coach-sticker-mini trainer-sticker-card" title="Trainer-Profil öffnen">
  <div class="st-top"><span class="st-top-item">${nat.c}</span><span class="st-top-item st-pos-box pos-coach">TR</span><span class="st-top-item">COACH</span></div>
  <div class="st-photo coach-photo">${c.photo?`<img src="${c.photo}" draggable="false">`:`<i class="ti ti-user-star" style="font-size:52px;color:rgba(255,255,255,.55)"></i>`}</div>
  <div class="st-bottom-bars"><div class="st-bottom-bar"><span>Alter</span><span class="bar-value">${age}</span></div><div class="st-bottom-bar"><span>Seit</span><span class="bar-value">${escapeHtml(c.takeoverYear||'—')}</span></div></div>
  <div class="st-name"><span>${escapeHtml(c.name||'Trainer')}</span></div>
</div>`}
  function renderLeaguePanel(){ensureExtras();const data=state.leagueSeasons[state.spread]||{leagueIndex:3,years:{},places:{}};const locked=state.spread===0;let html=`<div class="league-panel">`;LEAGUES.forEach((l,i)=>{html+=`<div class="league-row ${data.leagueIndex===i?'active':''} ${locked?'locked':''}" data-league-index="${i}" title="${locked?'Saison 1 startet fest in League Two':'Liga für diese Saison setzen'}"><span class="league-name">${l}</span><input class="league-place" data-league-place="${i}" maxlength="6" placeholder="Platz" value="${escapeHtml(data.places?.[i]||'')}"></div>`;if(i<LEAGUES.length-1){const key=`${i}-${i+1}`;html+=`<div class="league-gap"><input class="league-year" data-league-year="${key}" maxlength="4" inputmode="numeric" placeholder="Jahr" value="${escapeHtml(data.years?.[key]||'')}"></div>`;}});html+='</div>';return html;}

  async function makePageFlipOverlay(dir){

        state.leagueSeasons.push({leagueIndex:prev.leagueIndex,years:{...(prev.years||{})},places:{}});
        if(Array.isArray(state.awards)) state.awards.push(typeof blankAwards==='function'?blankAwards():{featured:{},trophies:[null]});
        setState({spreads:ns,spread:ns.length-1,seasonPage:0});
        saveState();
      };
    }
  };
})();

  const prevAttach=attachListeners;

  `;
  document.head.appendChild(style);

  function normalizeArchive(){
    if(!Array.isArray(state.stickerArchive)) state.stickerArchive=[];
    const seen=new Set();
    state.stickerArchive=state.stickerArchive.filter(Boolean).map(normalizeSticker).filter(s=>{
      if(!s || !s.id || seen.has(s.id)) return false;
      seen.add(s.id); return true;
    });
  }
  function archiveUpsert(sticker){
    if(!sticker || !sticker.id) return;
    normalizeArchive();
    const st=normalizeSticker({...sticker});
    const i=state.stickerArchive.findIndex(x=>x && x.id===st.id);
    if(i>=0) state.stickerArchive[i]={...state.stickerArchive[i],...st}; else state.stickerArchive.push(st);
  }
  function collectArchiveFromAlbum(){
    normalizeArchive();
    (state.spreads||[]).forEach(sp=>CATEGORIES.forEach(c=>(sp.categories?.[c.id]||[]).forEach(archiveUpsert)));
    (state.parking||[]).forEach(archiveUpsert);
    if(Array.isArray(state.awards)) state.awards.forEach(aw=>{
      if(aw?.featured) Object.values(aw.featured).forEach(archiveUpsert);
    });
  }
  function placedIdsInCurrentSeason(){
    const ids=new Set();
    const sp=currentSpread();
    CATEGORIES.forEach(c=>(sp.categories?.[c.id]||[]).forEach(s=>{if(s&&s.id)ids.add(s.id)}));
    if(Array.isArray(state.awards) && state.awards[state.spread]?.featured){
      Object.values(state.awards[state.spread].featured).forEach(s=>{if(s&&s.id)ids.add(s.id)});
    }
    return ids;
  }
  function syncReserveParking(){
    collectArchiveFromAlbum();
    const placed=placedIdsInCurrentSeason();
    const visible=state.stickerArchive.filter(s=>s && !placed.has(s.id)).map(s=>normalizeSticker({...s}));
    state.parking=[...visible,null];
  }

  const oldLoad=loadState;
  loadState=async function(){
    await oldLoad();
    try{const raw=await storageGet(ARCHIVE_KEY);if(raw)state.stickerArchive=JSON.parse(raw)||[];}catch(e){state.stickerArchive=[];}
    collectArchiveFromAlbum();
    normalizeArchive();
    render();
  };
  const oldSave=saveState;
  saveState=async function(){
    collectArchiveFromAlbum();
    normalizeArchive();
    await oldSave();
    try{await storageSet(ARCHIVE_KEY,JSON.stringify(state.stickerArchive||[]));}catch(e){}
  };

  // Reserve-Album: zeigt automatisch alle nicht eingeklebten Sticker der aktuellen Saison.
  const oldRenderParkingAlbum=renderParkingAlbum;
  renderParkingAlbum=function(){
    syncReserveParking();

    if(!state.parkingOpen){
      return `<button id="parking-toggle" class="parking-closed" title="Reserve-Album öffnen"><div class="parking-cover-content">${clubLogo(42)}<div class="parking-cover-title">Reserve<br>Album</div><div class="parking-cover-sub">${visible.length} Sticker</div></div></button>`;
    }
    const slots=visible.map((sticker,si)=>`<div class="parking-slot slot-teal" data-parking="1" data-si="${si}" data-drop="1">${stickerCardHTML(sticker,sticker.stickerNo||si+1,state.newKey===`parking-${si}`)}</div>`).join('');
    const empty=`<div class="reserve-empty-state">Alle Sticker dieser Saison sind eingeklebt</div>`;
    return `<div class="parking-panel"><div class="parking-page"><div class="parking-head"><div class="parking-title">${clubLogo(34)}<div><div>Reserve-Album</div><div class="reserve-archive-note">${visible.length} freie Sticker · eingeklebte Sticker werden ausgeblendet</div></div></div><div class="parking-actions"><button id="parking-close" class="parking-close"><i class="ti ti-chevron-down"></i></button></div></div><div class="parking-grid reserve-archive-grid">${slots||empty}</div></div></div>`;
  };

  function removeFromPageToReserve(target){
    if(!target) return;
    const arr=getSlotArray(target);
    if(arr && arr[target.si]){
      archiveUpsert(arr[target.si]);
      arr[target.si]=null;
      tidyCategoryPlaceholders();
      syncReserveParking();
      setState({showProfile:false,profileTarget:null,confirmDelSticker:false});
      saveState();
    }
  }
  function removeByOverlay(btn){
    const awardHost=btn.closest('[data-award-cat]')||btn.closest('[data-award]');
    if(awardHost){
      const aid=awardHost.dataset.awardCat||awardHost.dataset.award;
      const aw=Array.isArray(state.awards)?state.awards[state.spread]:null;
      if(aw?.featured && aw.featured[aid]){archiveUpsert(aw.featured[aid]);aw.featured[aid]=null;syncReserveParking();setState({showProfile:false,profileTarget:null});saveState();}
      return;
    }
    const card=btn.closest('.slot-teal,.parking-slot,.award-selected')?.querySelector('.sticker-card[data-id]') || btn.closest('.sticker-card[data-id]');
    const id=card?+card.dataset.id:0;
    if(!id) return;
    const loc=findSticker(id);
    if(loc && !loc.parking) removeFromPageToReserve(loc);
  }
  function addVisibleRemoveButtons(){
    document.querySelectorAll('.sticker-card .sticker-remove-x').forEach(b=>b.remove());
    document.querySelectorAll('.slot-teal .sticker-card[data-id], .award-selected .sticker-card[data-id]').forEach(card=>{
      const host=card.closest('.award-selected')||card.closest('.slot-teal')||card.parentElement;
      if(!host || host.querySelector(':scope > .sticker-remove-x.card-remove-overlay')) return;
      const loc=findSticker(+card.dataset.id);
      if(loc && loc.parking) return; // Reserve selbst nicht entfernen
      const btn=document.createElement('button');
      btn.className='sticker-remove-x card-remove-overlay';btn.type='button';btn.title='Sticker aus der Seite entfernen';btn.innerHTML='<i class="ti ti-x"></i>';
      btn.onclick=e=>{e.preventDefault();e.stopPropagation();removeByOverlay(btn);};
      host.appendChild(btn);
    });
  }

  // Profil-Loeschen legt Sticker ebenfalls in die Reserve.
  const oldAttachForDelete=attachListeners;
  attachListeners=function(){
    oldAttachForDelete();
    addVisibleRemoveButtons();
    const cst=document.getElementById('confirm-del-sticker');

      cst.onclick=()=>{
        if(!state.profileTarget) return setState({confirmDelSticker:false});
        if(state.profileTarget.parking){setState({confirmDelSticker:false,showProfile:false,profileTarget:null});return;}
        removeFromPageToReserve(state.profileTarget);
      };
    }
  };

  // Manuelle Liga-Historie komplett ersetzen: Eintraege koennen bearbeitet werden.
  function compactLeagueName(name){return String(name).replace(/Football League/g,'Football-League');}
  function seasonStartYear(i){const txt=seasonYearText(i);return String(txt).split('/')[0]||String(2025+i);}
  function normalizeHistoryFinal(){
    if(!Array.isArray(state.leagueHistoryEntries)) state.leagueHistoryEntries=[];
    state.leagueHistoryEntries=state.leagueHistoryEntries.map((e,idx)=>({
      id:e.id||Date.now()+idx,
      seasonIndex:Number.isInteger(e.seasonIndex)?e.seasonIndex:(parseInt(e.seasonIndex||state.spread||0,10)||0),
      year:String(e.year||seasonStartYear(Number.isInteger(e.seasonIndex)?e.seasonIndex:(state.spread||0))),
      leagueIndex:Math.max(0,Math.min(FINAL_LEAGUES.length-1,parseInt(e.leagueIndex,10)||0)),
      place:String(e.place||'').trim(),promotion:!!e.promotion,relegation:!!e.relegation
    })).filter(e=>e.place);
  }
  function visibleHistoryFinal(){normalizeHistoryFinal();return state.leagueHistoryEntries.filter(e=>e.seasonIndex<=state.spread).sort((a,b)=>(b.seasonIndex-a.seasonIndex)||(b.id-a.id));}
  function renderHistoryFormFinal(){
    if(!state.showLeagueHistoryForm) return '';
    normalizeHistoryFinal();
    const editId=state.editLeagueHistoryId;
    const edit=editId?state.leagueHistoryEntries.find(e=>e.id===editId):null;
    const li=edit?edit.leagueIndex:0, pl=edit?edit.place:'';
    return `<div class="manual-history-form">
      <select id="manual-history-league" class="manual-history-select">${FINAL_LEAGUES.map((l,i)=>`<option value="${i}"${i===li?' selected':''}>${escapeHtml(compactLeagueName(l))}</option>`).join('')}</select>
      <input id="manual-history-place" class="manual-history-input" maxlength="6" placeholder="Platz" value="${escapeHtml(pl)}">
      <div class="manual-history-checks"><label><input type="checkbox" id="manual-history-promotion"${edit?.promotion?' checked':''}> Aufstieg</label><label><input type="checkbox" id="manual-history-relegation"${edit?.relegation?' checked':''}> Abstieg</label></div>
      <div class="manual-history-actions"><button id="manual-history-save" class="manual-history-save${edit?' is-editing':''}" type="button">${edit?'Ändern':'Speichern'}</button><button id="manual-history-cancel" class="manual-history-cancel" type="button">Abbrechen</button></div>
    </div>`;
  }
  function renderHistoryListFinal(){
    const rows=visibleHistoryFinal();
    if(!rows.length) return '<div class="manual-history-empty">Noch keine Historie gespeichert</div>';
    let html='<div class="manual-history-list">', lastYear=null;
    rows.forEach(e=>{
      if(e.year!==lastYear){html+=`<div class="manual-history-group-year">${escapeHtml(e.year)}</div>`;lastYear=e.year;}
      const cls=e.promotion?' is-promotion':(e.relegation?' is-relegation':'');
      const badge=e.promotion?'Aufstieg':(e.relegation?'Abstieg':'');
      html+=`<div class="manual-history-entry${cls}" data-history-entry="${e.id}"><span class="manual-history-entry-league" title="${escapeHtml(compactLeagueName(FINAL_LEAGUES[e.leagueIndex]||'Liga'))}">${escapeHtml(compactLeagueName(FINAL_LEAGUES[e.leagueIndex]||'Liga'))}</span><span class="manual-history-entry-place">${escapeHtml(e.place)}</span><button class="manual-history-edit" data-history-edit="${e.id}" type="button" title="Eintrag ändern"><i class="ti ti-pencil"></i></button>${badge?`<span class="manual-history-badge">${badge}</span>`:''}</div>`;
    });
    return html+'</div>';
  }
  function renderHistoryPanelFinal(){
    normalizeHistoryFinal();
    return `<div class="league-panel manual-history-panel"><div class="manual-history-head"><div class="manual-history-title">Liga-Historie</div><div class="manual-history-year">${escapeHtml(seasonStartYear(state.spread||0))}</div><button id="manual-history-add" class="manual-history-add" type="button" title="Historie-Eintrag hinzufügen">+</button></div>${renderHistoryFormFinal()}${renderHistoryListFinal()}</div>`;
  }
  function bindHistoryPanelFinal(){
    document.querySelectorAll('.league-panel').forEach(p=>p.remove());
    const shell=document.querySelector('.app-shell'); if(!shell) return;
    shell.insertAdjacentHTML('beforeend',renderHistoryPanelFinal());
    const add=document.getElementById('manual-history-add'); if(add) add.onclick=()=>setState({showLeagueHistoryForm:true,editLeagueHistoryId:null});
    const cancel=document.getElementById('manual-history-cancel'); if(cancel) cancel.onclick=()=>setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});
    const place=document.getElementById('manual-history-place'); if(place) place.oninput=()=>{place.value=place.value.replace(/[^0-9.]/g,'').slice(0,6)};
    const promo=document.getElementById('manual-history-promotion'), releg=document.getElementById('manual-history-relegation');
    if(promo&&releg){promo.onchange=()=>{if(promo.checked)releg.checked=false};releg.onchange=()=>{if(releg.checked)promo.checked=false};}
    const save=document.getElementById('manual-history-save');
    if(save) save.onclick=()=>{
      normalizeHistoryFinal();
      const li=parseInt((document.getElementById('manual-history-league')||{}).value||'0',10)||0;
      const pl=((document.getElementById('manual-history-place')||{}).value||'').trim(); if(!pl) return;
      const payload={seasonIndex:state.spread||0,year:seasonStartYear(state.spread||0),leagueIndex:li,place:pl,promotion:!!(document.getElementById('manual-history-promotion')||{}).checked,relegation:!!(document.getElementById('manual-history-relegation')||{}).checked};
      if(state.editLeagueHistoryId){const i=state.leagueHistoryEntries.findIndex(e=>e.id===state.editLeagueHistoryId); if(i>=0) state.leagueHistoryEntries[i]={...state.leagueHistoryEntries[i],...payload};}
      else state.leagueHistoryEntries.push({id:Date.now(),...payload});
      setState({showLeagueHistoryForm:false,editLeagueHistoryId:null}); saveState();
    };
    document.querySelectorAll('[data-history-edit]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();setState({showLeagueHistoryForm:true,editLeagueHistoryId:+btn.dataset.historyEdit});});
  }
  const prevAttachHistory=attachListeners;
  attachListeners=function(){prevAttachHistory();bindHistoryPanelFinal();addVisibleRemoveButtons();};
})();

// --- Finale Anpassung: Auszeichnungen im Profil, graue verkaufte Spieler, reduzierte Positionen ---
(function(){
  const ALLOWED_POSITIONS=['TW','IV','LV','RV','DM','ZM','OM','LF','RF','ST'];
  const AWARD_TITLE_MAP={
    topScorer:'Torschuetzenkoenig',
    mostScorers:'Meiste Scorer',
    playerSeason:'Spieler der Saison',

  `;
  document.head.appendChild(finalStyle);

  function applyPositionSet(){
    try{POSITIONS.splice(0,POSITIONS.length,...ALLOWED_POSITIONS);}catch(e){}
    try{
      POSITION_GROUPS.keeper.splice(0,POSITION_GROUPS.keeper.length,'TW');
      POSITION_GROUPS.defenders.splice(0,POSITION_GROUPS.defenders.length,'IV','LV','RV');
      POSITION_GROUPS.midfield.splice(0,POSITION_GROUPS.midfield.length,'DM','ZM','OM');
      POSITION_GROUPS.forwards.splice(0,POSITION_GROUPS.forwards.length,'LF','RF','ST');
    }catch(e){}
    try{
      Object.assign(LEGACY_POS,{GK:'TW',CB:'IV',LB:'LV',RB:'RV',LAV:'LV',RAV:'RV',CM:'ZM',CAM:'OM',CDM:'DM',LM:'LF',RM:'RF',LW:'LF',RW:'RF',LA:'LF',RA:'RF',MS:'ST',HS:'ST',CF:'ST'});
    }catch(e){}
    try{
      Object.assign(POS_COLOR,{TW:'#9ca3af',IV:'#67e8f9',LV:'#67e8f9',RV:'#67e8f9',DM:'#2563eb',ZM:'#2563eb',OM:'#2563eb',LF:'#ec4899',RF:'#ec4899',ST:'#ec4899'});
    }catch(e){}
  }
  applyPositionSet();

  const prevNormalizePos=normalizePos;
  normalizePos=function(pos){
    const mapped=(LEGACY_POS && LEGACY_POS[pos]) || pos || 'TW';
    return ALLOWED_POSITIONS.includes(mapped)?mapped:(prevNormalizePos?prevNormalizePos(mapped):'TW');
  };
  const prevNormalizeSticker=normalizeSticker;
  normalizeSticker=function(s){
    const st=prevNormalizeSticker(s);
    if(!st) return st;
    st.position=normalizePos(st.position);
    st.status=st.status||((st.sold||st.leftClub)?'sold':(st.loaned?'loan':'active'));
    st.sold=st.status==='sold';
    return st;
  };

  function playerMatches(a,b){
    if(!a||!b) return false;
    if(a.id && b.id && String(a.id)===String(b.id)) return true;
    const an=String(a.name||'').trim().toLowerCase();
    const bn=String(b.name||'').trim().toLowerCase();
    return !!an && an===bn;
  }
  function awardEntriesForSticker(sticker){
    if(!sticker || !Array.isArray(state.awards)) return [];
    const rows=[];
    state.awards.forEach((aw,seasonIndex)=>{

      Object.keys(featured).forEach(aid=>{

(function(){

    if(!Array.isArray(state.stickerArchive)) state.stickerArchive=[];

    state.stickerArchive=state.stickerArchive.map(copySticker).filter(s=>{
      if(!s||!s.id||seen.has(String(s.id))) return false;
      seen.add(String(s.id));
      return true;
    });
  }
  function archiveUpsertPatch(sticker){
    const st=copySticker(sticker);
    if(!st||!st.id) return;
    normalizeArchivePatch();
    const idx=state.stickerArchive.findIndex(x=>String(x.id)===String(st.id));
    if(idx>=0) state.stickerArchive[idx]={...state.stickerArchive[idx],...st};
    else state.stickerArchive.push(st);
  }
  function collectArchivePatch(){
    normalizeArchivePatch();
    (state.spreads||[]).forEach(sp=>CATEGORIES.forEach(c=>(sp.categories?.[c.id]||[]).forEach(s=>{if(s)archiveUpsertPatch(s);})));    
    (state.parking||[]).forEach(s=>{if(s)archiveUpsertPatch(s);});
    if(Array.isArray(state.awards)) state.awards.forEach(aw=>{
      if(aw?.featured) Object.values(aw.featured).forEach(s=>{if(s)archiveUpsertPatch(s);});

  function rosterIdsCurrentSeasonOnly(){

    return ids;
  }
  function syncReserveOnlyRosterHidden(){
    collectArchivePatch();
    const roster=rosterIdsCurrentSeasonOnly();
    const visible=state.stickerArchive.filter(s=>s && !roster.has(String(s.id))).map(copySticker);
    state.parking=[...visible,null];

  const prevRenderParking=renderParkingAlbum;

      return `<button id="parking-toggle" class="parking-closed" title="Reserve-Album öffnen"><div class="parking-cover-content">${clubLogo(42)}<div class="parking-cover-title">Reserve<br>Album</div><div class="parking-cover-sub">${visible.length} Sticker</div></div></button>`;

  };

  const prevSaveReservePatch=saveState;
  saveState=async function(){
    collectArchivePatch();
    normalizeArchivePatch();
    await prevSaveReservePatch();
    try{await storageSet(PATCH_ARCHIVE_KEY,JSON.stringify(state.stickerArchive||[]));}catch(e){}

  const prevLoadReservePatch=loadState;

  function seasonLabelPatch(i){

  function targetHistoryIndex(){return Math.max(0,(parseInt(state.spread||0,10)||0)-1);}
  function compactLeaguePatch(name){return String(name||'Liga').replace(/Football League/g,'Football-League');}
  function normalizeHistoryPatch(){
    if(!Array.isArray(state.leagueHistoryEntries)) state.leagueHistoryEntries=[];
    state.leagueHistoryEntries=state.leagueHistoryEntries.map((e,idx)=>{
      let rsi;

      else {

    </div>`;

  function renderHistoryListPatch(){

    if(!rows.length) return '<div class="manual-history-empty">Noch keine Historie gespeichert</div>';

    rows.forEach(e=>{

      const cls=e.promotion?' is-promotion':(e.relegation?' is-relegation':'');

      html+=`<div class="manual-history-entry${cls}" data-history-entry="${e.id}"><span class="manual-history-entry-league" title="${escapeHtml(compactLeaguePatch(PATCH_LEAGUES[e.leagueIndex]||'Liga'))}">${escapeHtml(compactLeaguePatch(PATCH_LEAGUES[e.leagueIndex]||'Liga'))}</span><span class="manual-history-entry-place">${escapeHtml(e.place)}</span><button class="manual-history-edit" data-history-edit="${e.id}" type="button" title="Eintrag ändern"><i class="ti ti-pencil"></i></button>${badge?`<span class="manual-history-badge">${badge}</span>`:''}</div>`;
    });
    return html+'</div>';
  }
  function renderHistoryPanelPatch(){
    normalizeHistoryPatch();
    const first=(state.spread||0)===0;
    const label=first?seasonLabelPatch(0):seasonLabelPatch(targetHistoryIndex());
    return `<div class="league-panel manual-history-panel final-season-history vorsaison-history"><div class="manual-history-head"><div class="manual-history-title">Liga-Historie</div><div class="manual-history-year">${escapeHtml(label)}</div><button id="manual-history-add" class="manual-history-add${first?' is-disabled':''}" type="button" title="Historie-Eintrag hinzufügen">+</button></div>${renderHistoryFormPatch()}${renderHistoryListPatch()}</div>`;
  }
  function bindHistoryPanelPatch(){
    document.querySelectorAll('.league-panel').forEach(p=>p.remove());
    const shell=document.querySelector('.app-shell'); if(!shell) return;
    shell.insertAdjacentHTML('beforeend',renderHistoryPanelPatch());

    const cancel=document.getElementById('manual-history-cancel'); if(cancel) cancel.onclick=()=>setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});
    const place=document.getElementById('manual-history-place'); if(place) place.oninput=()=>{place.value=place.value.replace(/[^0-9.]/g,'').slice(0,6)};

    const save=document.getElementById('manual-history-save');
    if(save) save.onclick=()=>{
      normalizeHistoryPatch();
      const li=Math.max(0,Math.min(PATCH_LEAGUES.length-1,parseInt((document.getElementById('manual-history-league')||{}).value||'0',10)||0));

(function(){

    .profile-awards-under-photo .profile-award-pill{border:1px solid rgba(21,59,115,.26);background:var(--crest-gold);color:var(--crest-blue);border-radius:999px;padding:5px 9px;font-family:monospace;font-size:12px;line-height:1;font-weight:400;box-shadow:0 2px 7px rgba(0,0,0,.12)}
    @media(max-width:980px){.profile-awards-under-photo{max-width:520px}.profile-awards-under-photo .profile-awards-label{min-width:0;width:100%}}
  `;
  document.head.appendChild(style);

  const AWARD_TITLE_MAP={
    topScorer:'Torschützenkönig',
    mostScorers:'Meiste Scorer',
    playerSeason:'Spieler der Saison',
    u19PlayerSeason:'Jugendspieler U19',
    goalSeason:'Tor der Saison'
  };
  function matchSticker(a,b){
    if(!a||!b)return false;
    if(a.id&&b.id&&String(a.id)===String(b.id))return true;
    const an=String(a.name||'').trim().toLowerCase();
    const bn=String(b.name||'').trim().toLowerCase();
    return !!an&&an===bn;
  }
  function awardRowsFor(sticker){
    if(!sticker||!Array.isArray(state.awards))return [];
    const rows=[];
    state.awards.forEach((aw,seasonIndex)=>{
      const featured=aw&&aw.featured?aw.featured:{};
      Object.keys(featured).forEach(aid=>{
        const s=featured[aid];
        if(matchSticker(sticker,s))rows.push({title:AWARD_TITLE_MAP[aid]||aid,season:seasonYearText(seasonIndex),seasonIndex});
      });
    });
    rows.sort((a,b)=>a.title.localeCompare(b.title,'de')||a.seasonIndex-b.seasonIndex);
    return rows;
  }
  function renderAwardsUnderPhoto(sticker){
    const rows=awardRowsFor(sticker);
    if(!rows.length)return '';
    const grouped={};
    rows.forEach(r=>{(grouped[r.title]=grouped[r.title]||[]).push(r);});
    return `<div class="profile-awards-under-photo"><div class="profile-awards-heading"><i class="ti ti-award"></i> Auszeichnungen</div>${Object.keys(grouped).map(title=>`<div class="profile-awards-row"><span class="profile-awards-label">${escapeHtml(title)}</span>${grouped[title].map(r=>`<span class="profile-award-pill">${escapeHtml(r.season)}</span>`).join('')}</div>`).join('')}</div>`;
  }

  const prevProfileModal=profileModal;
  profileModal=function(){
    let html=prevProfileModal();
    const sticker=state.profileTarget&&state.profileTarget.sticker?state.profileTarget.sticker:null;
    const block=renderAwardsUnderPhoto(sticker);
    if(!block)return html;
    const frameIdx=html.indexOf('class="profile-photo-frame"');
    if(frameIdx===-1)return html;
    const marker='</div></div><div class="profile-side"';
    const insertIdx=html.indexOf(marker,frameIdx);
    if(insertIdx===-1)return html;
    return html.slice(0,insertIdx+6)+block+html.slice(insertIdx+6);
  };
})();

    const t=firstEmptyRosterTarget();
    setState({showAdd:true,addTarget:t,showRosterPicker:false,rosterPickerTarget:null});
    saveState();
  }

  const prevAttach=attachListeners;
  attachListeners=function(){
    prevAttach();
    positionGlobalAdd();
    const gab=document.getElementById('global-add-btn');
    if(gab)gab.onclick=(e)=>{e.preventDefault();e.stopPropagation();openNewStickerFromRedPlus();};
    document.querySelectorAll('.slot-empty[data-cid]').forEach(el=>{
      el.onclick=e=>{
        e.preventDefault(); e.stopPropagation();
        setState({showRosterPicker:true,rosterPickerTarget:{cid:el.dataset.cid,si:+el.dataset.si},showAdd:false,addTarget:null});
      };
    });
    ensureRosterPickerModal();
  };
  window.addEventListener('resize',()=>setTimeout(positionGlobalAdd,50));
})();

  `;
  document.head.appendChild(style);

  function compactLeague(name){return String(name||'Liga').replace(/Football League/g,'Football-League');}
  function copyStickerAuto(st){return st?normalizeSticker({...st}):null;}
  function sortByName(a,b){return String(a?.name||'').localeCompare(String(b?.name||''),'de',{sensitivity:'base'});}

  function normalizeAutoHistory(){
    if(!Array.isArray(state.autoLeagueHistory)) state.autoLeagueHistory=[];
    const bySeason=new Map();
    state.autoLeagueHistory.forEach((e,idx)=>{
      const si=Math.max(0,parseInt(e.resultSeasonIndex??e.seasonIndex??idx,10)||0);
      if(si>=Math.max(0,(state.spreads||[]).length-1)) return;
      if(bySeason.has(si)) return;
      bySeason.set(si,{id:e.id||Date.now()+idx,resultSeasonIndex:si,season:seasonYearText(si),leagueIndex:Math.max(0,Math.min(AUTO_LEAGUES.length-1,parseInt(e.leagueIndex,10)||3)),place:String(e.place||'').trim(),promotion:!!e.promotion,relegation:!!e.relegation});
    });
    for(let si=0;si<Math.max(0,(state.spreads||[]).length-1);si++){
      if(!bySeason.has(si)) bySeason.set(si,{id:Date.now()+si,resultSeasonIndex:si,season:seasonYearText(si),leagueIndex:3,place:'',promotion:false,relegation:false});
    }
    state.autoLeagueHistory=Array.from(bySeason.values()).sort((a,b)=>a.resultSeasonIndex-b.resultSeasonIndex);
    // alte Historien absichtlich leeren, damit nichts doppelt erscheint
    state.leagueHistoryEntries=[];
  }
  function visibleAutoHistory(){
    normalizeAutoHistory();
    const max=(parseInt(state.spread||0,10)||0)-1;
    if(max<0) return [];
    return state.autoLeagueHistory.filter(e=>e.resultSeasonIndex<=max);
  }
  function renderAutoHistoryPanel(){
    const rows=visibleAutoHistory();
    let body='';
    if(!rows.length){
      body='<div class="auto-history-empty">Historie startet mit Saison 2</div>';
    } else {
      body='<div class="auto-history-list">'+rows.map(e=>{
        const cls=e.promotion?' is-promotion':(e.relegation?' is-relegation':'');
        return `<div class="auto-history-season">${escapeHtml(e.season||seasonYearText(e.resultSeasonIndex))}</div>
          <div class="auto-history-entry${cls}" data-auto-history="${e.resultSeasonIndex}">
            <select data-auto-history-league="${e.resultSeasonIndex}">${AUTO_LEAGUES.map((l,i)=>`<option value="${i}"${i===e.leagueIndex?' selected':''}>${escapeHtml(compactLeague(l))}</option>`).join('')}</select>
            <input type="text" data-auto-history-place="${e.resultSeasonIndex}" maxlength="6" placeholder="Platz" value="${escapeHtml(e.place||'')}">

  }
  function updateAutoEntry(si,patch){
    normalizeAutoHistory();
    si=Math.max(0,parseInt(si,10)||0);
    let e=state.autoLeagueHistory.find(x=>x.resultSeasonIndex===si);
    if(!e){e={id:Date.now()+si,resultSeasonIndex:si,season:seasonYearText(si),leagueIndex:3,place:'',promotion:false,relegation:false};state.autoLeagueHistory.push(e);}

      ch.onchange=()=>updateAutoEntry(ch.dataset.autoHistoryPromotion,{promotion:!!ch.checked,relegation:false});
    });
    document.querySelectorAll('[data-auto-history-relegation]').forEach(ch=>{
      ch.onchange=()=>updateAutoEntry(ch.dataset.autoHistoryRelegation,{relegation:!!ch.checked,promotion:false});
    });
  }

  // Reserve-Album alphabetisch sortieren und nur Kaderseite der aktuellen Saison ausblenden
  function collectArchiveSorted(){
    const map=new Map();
    const keyFor=st=>String(st?.name||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')||String(st?.id||'');
    function upsert(st){const s=copyStickerAuto(st); if(!s||!s.id)return; const k=keyFor(s); map.set(k,{...(map.get(k)||{}),...s});}
    if(Array.isArray(state.stickerArchive)) state.stickerArchive.forEach(upsert);
    (state.spreads||[]).forEach(sp=>CATEGORIES.forEach(c=>(sp.categories?.[c.id]||[]).forEach(upsert)));
    (state.parking||[]).forEach(upsert);
    if(Array.isArray(state.awards)) state.awards.forEach(aw=>{if(aw?.featured) Object.values(aw.featured).forEach(upsert);});
    state.stickerArchive=Array.from(map.values()).sort(sortByName);
  }
  function currentRosterIdSet(){
    const ids=new Set();
    const nameKey=st=>String(st?.name||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
    const sp=currentSpread();
    CATEGORIES.forEach(c=>(sp.categories?.[c.id]||[]).forEach(s=>{if(s&&s.id)ids.add(String(s.id));const nk=nameKey(s);if(nk)ids.add('name:'+nk);}));
    return ids;
  }
  const previousRenderParking=renderParkingAlbum;
  renderParkingAlbum=function(){
    collectArchiveSorted();
    const roster=currentRosterIdSet();
    const visible=(state.stickerArchive||[]).filter(s=>{const nk=String(s?.name||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');return s&&!roster.has(String(s.id))&&!roster.has('name:'+nk);}).sort(sortByName).map(copyStickerAuto);
    state.parking=[...visible,null];
    if(!state.parkingOpen){
      return `<button id="parking-toggle" class="parking-closed" title="Reserve-Album öffnen"><div class="parking-cover-content">${clubLogo(42)}<div class="parking-cover-title">Reserve<br>Album</div><div class="parking-cover-sub">${visible.length} Sticker</div></div></button>`;
    }
    const slots=visible.map((sticker,si)=>`<div class="parking-slot slot-teal" data-parking="1" data-si="${si}" data-drop="1">${stickerCardHTML(sticker,sticker.stickerNo||si+1,state.newKey===`parking-${si}`)}</div>`).join('');
    const empty=`<div class="reserve-empty-state">Alle Kader-Sticker dieser Saison sind eingeklebt</div>`;
    return `<div class="parking-panel"><div class="parking-page"><div class="parking-head"><div class="parking-title">${clubLogo(34)}<div><div>Reserve-Album</div><div class="reserve-archive-note">${visible.length} freie Sticker · alphabetisch sortiert</div></div></div><div class="parking-actions"><button id="parking-close" class="parking-close"><i class="ti ti-chevron-down"></i></button></div></div><div class="parking-grid reserve-archive-grid">${slots||empty}</div></div></div>`;
  };

  const previousSave=saveState;
  saveState=async function(){
    normalizeAutoHistory();
    collectArchiveSorted();
    await previousSave();
    try{await storageSet(AUTO_HISTORY_KEY,JSON.stringify(state.autoLeagueHistory||[]));}catch(e){}
    try{await storageSet('crewe-league-history-v1','[]');await storageSet('crewe-league-history-vorsaison-v3',JSON.stringify({leagueHistoryEntries:[],marker:'cleared-by-auto-history'}));}catch(e){}
  };
  const previousLoad=loadState;
  loadState=async function(){
    await previousLoad();
    try{
      const cleared=await storageGet(AUTO_HISTORY_RESET_KEY);
      if(!cleared){
        state.leagueHistoryEntries=[];
        state.autoLeagueHistory=[];
        await storageSet(AUTO_HISTORY_RESET_KEY,'1');
        await storageSet(AUTO_HISTORY_KEY,'[]');
      } else {
        const raw=await storageGet(AUTO_HISTORY_KEY);
        state.autoLeagueHistory=raw?JSON.parse(raw)||[]:[];
      }
    }catch(e){state.autoLeagueHistory=[];state.leagueHistoryEntries=[];}
    normalizeAutoHistory();
    collectArchiveSorted();
    render();
  };
  const previousAttach=attachListeners;
  attachListeners=function(){
    previousAttach();
    bindAutoHistoryPanel();
    const add=document.getElementById('add-spread-btn');
    if(add){
      const oldAdd=add.onclick;
      add.onclick=(ev)=>{
        if(oldAdd) oldAdd.call(add,ev);
        setTimeout(()=>{normalizeAutoHistory();saveState();render();},0);
      };
    }
  };
})();

  `;
  document.head.appendChild(style);

  function ensureLocks(){
    if(!Array.isArray(state.seasonLocked)) state.seasonLocked=[];
    for(let i=0;i<(state.spreads||[]).length;i++) state.seasonLocked[i]=!!state.seasonLocked[i];
  }
  function isSeasonLocked(){ensureLocks();return !!state.seasonLocked[state.spread||0];}
  async function persistLocks(){try{await storageSet(LOCK_STORAGE_KEY,JSON.stringify(state.seasonLocked||[]));}catch(e){}}
  function applyLockedUi(){
    ensureLocks();
    const locked=isSeasonLocked();
    document.body.classList.toggle('season-is-locked',locked);
    document.querySelectorAll('.app-shell').forEach(shell=>shell.classList.toggle('season-locked',locked));
    if(locked){
      document.querySelectorAll('.sticker-card,.award-card').forEach(card=>card.setAttribute('draggable','false'));
      document.querySelectorAll('.slot-empty,.trophy-add-card').forEach(el=>{el.onclick=null;});

    if((state.seasonPage||0)!==1) {applyLockedUi();return;}
    const locked=isSeasonLocked();
    const target=document.querySelector('.page-right .page-inner')||document.querySelector('.page-left .page-inner');

    if(locked){
      const badge=document.createElement('div');
      badge.className='season-locked-badge';
      badge.innerHTML='<i class="ti ti-lock"></i> Saison eingefroren';
      target.appendChild(badge);

    applyLockedUi();

  function removeTrophyByButton(btn){

    const host=btn.closest('[data-trophy="1"]');
    const si=host?parseInt(host.dataset.si||'0',10):NaN;
    if(!Number.isNaN(si) && Array.isArray(state.awards) && state.awards[state.spread] && Array.isArray(state.awards[state.spread].trophies)){
      state.awards[state.spread].trophies[si]=null;
      setState({showTrophyEdit:false,trophyTarget:null});
      saveState();

  }
  function forceVisibleTrophyRemoveButtons(){
    if(isSeasonLocked()) return;

  const prevSave=saveState;
  saveState=async function(){ensureLocks();await prevSave();await persistLocks();};
  const prevLoad=loadState;
  loadState=async function(){await prevLoad();try{const raw=await storageGet(LOCK_STORAGE_KEY);state.seasonLocked=raw?JSON.parse(raw)||[]:state.seasonLocked||[];}catch(e){state.seasonLocked=state.seasonLocked||[]}ensureLocks();render();};

  storageGet(LOCK_STORAGE_KEY).then(raw=>{try{state.seasonLocked=raw?JSON.parse(raw)||[]:state.seasonLocked||[];}catch(e){}ensureLocks();if(state.loaded)render();});

  const prevAttach=attachListeners;
  attachListeners=function(){
    prevAttach();
    addSeasonLockButton();
    forceVisibleTrophyRemoveButtons();
    if(isSeasonLocked()){

        card.onclick=(e)=>{e.preventDefault();e.stopPropagation();};
      });

    }
  };
})();

  const style=document.createElement('style');

      border:1px solid rgba(255,255,255,.18)!important;
      border-radius:14px!important;
      padding:10px!important;
      box-shadow:0 12px 34px rgba(0,0,0,.25)!important;
      backdrop-filter:blur(4px)!important;
    }
    .manual-history-head{grid-template-columns:minmax(0,1fr)!important;margin-bottom:9px!important}
    .manual-history-title{font-size:13px!important;letter-spacing:1px!important;color:#fff!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .manual-history-year,.manual-history-add{display:none!important}
    .manual-history-empty{font-size:11px!important;color:rgba(255,255,255,.55)!important;border:1px dashed rgba(255,255,255,.22)!important;background:rgba(255,255,255,.04)!important;border-radius:10px!important;padding:12px!important;text-align:center!important}
    .manual-history-list{display:flex!important;flex-direction:column!important;gap:7px!important;max-width:100%!important;overflow:hidden!important}
    .manual-history-group-year{order:0!important;margin:6px 0 0!important;color:rgba(255,255,255,.72)!important;font-family:monospace!important;font-size:12px!important;letter-spacing:.4px!important;display:flex!important;align-items:center!important;gap:7px!important;white-space:nowrap!important}
    .manual-history-group-year:before,.manual-history-group-year:after{content:""!important;height:1px!important;flex:1!important;background:rgba(255,255,255,.18)!important;min-width:10px!important}
    .manual-history-entry{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(42px,58px) 26px!important;align-items:center!important;gap:7px!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;overflow:hidden!important;padding:8px!important;border-radius:10px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.07)!important;color:rgba(255,255,255,.82)!important}
    .manual-history-entry.is-promotion{background:rgba(215,169,59,.94)!important;color:var(--blue)!important;border-color:rgba(255,255,255,.35)!important}
    .manual-history-entry.is-relegation{background:rgba(200,16,46,.88)!important;color:#fff!important;border-color:rgba(255,255,255,.28)!important}
    .manual-history-entry-league{min-width:0!important;font-size:12px!important;font-weight:900!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
    .manual-history-entry-place{justify-self:end!important;min-width:42px!important;max-width:58px!important;text-align:center!important;border:1px solid currentColor!important;border-radius:999px!important;padding:4px 6px!important;font-family:monospace!important;font-size:12px!important;line-height:1!important;background:rgba(255,255,255,.14)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}
    .manual-history-edit{width:25px!important;height:25px!important;border-radius:50%!important;border:1px solid rgba(255,255,255,.62)!important;background:rgba(255,255,255,.12)!important;color:currentColor!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;font-size:12px!important;line-height:1!important;padding:0!important;justify-self:end!important}
    .manual-history-edit:hover{background:var(--gold)!important;color:var(--blue)!important;border-color:#fff!important}
    .manual-history-badge{grid-column:1 / -1!important;font-size:9.5px!important;font-weight:900!important;letter-spacing:.7px!important;text-transform:uppercase!important;opacity:.85!important;margin-top:-2px!important}
    .manual-history-form{display:grid!important;grid-template-columns:minmax(0,1fr) 64px!important;gap:7px!important;margin:9px 0 10px!important;padding:9px!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:12px!important;background:rgba(255,255,255,.08)!important;box-sizing:border-box!important}
    .manual-history-select,.manual-history-input{min-width:0!important;width:100%!important;border:1px solid rgba(255,255,255,.28)!important;border-radius:8px!important;background:rgba(255,255,255,.94)!important;color:var(--blue)!important;font-size:12px!important;font-family:Arial,Helvetica,sans-serif!important;padding:7px 8px!important;outline:none!important;box-sizing:border-box!important}
    .manual-history-input{text-align:center!important;font-family:monospace!important}
    .manual-history-checks{grid-column:1 / -1!important;display:flex!important;gap:8px!important;align-items:center!important;flex-wrap:wrap!important;color:#fff!important;font-size:11px!important}
    .manual-history-checks label{display:inline-flex!important;align-items:center!important;gap:5px!important;font-weight:800!important;letter-spacing:.2px!important;cursor:pointer!important}
    .manual-history-actions{grid-column:1 / -1!important;display:flex!important;gap:7px!important}
    .manual-history-save,.manual-history-cancel{flex:1!important;border:none!important;border-radius:999px!important;padding:7px 10px!important;font-size:11px!important;font-weight:900!important;letter-spacing:.6px!important;text-transform:uppercase!important;cursor:pointer!important}
    .manual-history-save{background:var(--gold)!important;color:var(--blue)!important}.manual-history-cancel{background:rgba(255,255,255,.14)!important;color:#fff!important}
    @media(max-width:1280px){.league-panel.manual-history-panel,.league-panel.manual-history-panel.final-season-history,.league-panel.manual-history-panel.album-bound-history{position:static!important;width:100%!important;max-width:100%!important;max-height:none!important;margin:14px 0!important;right:auto!important;bottom:auto!important}.manual-history-entry-league{white-space:normal!important;text-overflow:clip!important}}
  `;
  document.head.appendChild(style);

  function seasonLabelSafe(i){
    const idx=Math.max(0,parseInt(i||0,10)||0);
    if(typeof seasonYearText==='function') return seasonYearText(idx);
    const y=2025+idx; return `${y}/${String((y+1)%100).padStart(2,'0')}`;
  }
  function compactLeague(name){return String(name||'Liga').replace(/Football League/g,'Football-League');}
  function oneEntryPerPastSeason(){
    if(!Array.isArray(state.leagueHistoryEntries)) state.leagueHistoryEntries=[];
    const bySeason=new Map();
    state.leagueHistoryEntries.forEach((e,idx)=>{
      const raw=Number.isInteger(e.resultSeasonIndex)?e.resultSeasonIndex:(Number.isInteger(e.seasonIndex)?e.seasonIndex:parseInt(e.seasonIndex??e.resultSeasonIndex??idx,10)||0);
      const rsi=Math.max(0,raw);
      const normalized={
        id:e.id||Date.now()+idx,
        resultSeasonIndex:rsi,
        seasonIndex:rsi,
        season:seasonLabelSafe(rsi),
        leagueIndex:Math.max(0,Math.min(HISTORY_LEAGUES.length-1,parseInt(e.leagueIndex,10)||0)),
        place:String(e.place||'').trim(),
        promotion:!!e.promotion,
        relegation:!!e.relegation
      };
      if(!bySeason.has(rsi) || (normalized.place && !bySeason.get(rsi).place)) bySeason.set(rsi,normalized);
    });
    const maxPast=Math.max(-1,(state.spread||0)-1);
    for(let i=0;i<=maxPast;i++){
      if(!bySeason.has(i)) bySeason.set(i,{id:Date.now()+1000+i,resultSeasonIndex:i,seasonIndex:i,season:seasonLabelSafe(i),leagueIndex:3,place:'',promotion:false,relegation:false});
    }
    state.leagueHistoryEntries=Array.from(bySeason.values()).sort((a,b)=>a.resultSeasonIndex-b.resultSeasonIndex);
  }
  function visibleRows(){
    oneEntryPerPastSeason();
    if((state.spread||0)===0) return [];
    const max=(state.spread||0)-1;
    return state.leagueHistoryEntries.filter(e=>e.resultSeasonIndex<=max).sort((a,b)=>b.resultSeasonIndex-a.resultSeasonIndex);
  }
  function renderHistoryForm(){
    if(!state.showLeagueHistoryForm || !state.editLeagueHistoryId) return '';
    oneEntryPerPastSeason();
    const edit=state.leagueHistoryEntries.find(e=>String(e.id)===String(state.editLeagueHistoryId));
    if(!edit) return '';
    return `<div class="manual-history-form">
      <select id="manual-history-league" class="manual-history-select">${HISTORY_LEAGUES.map((l,i)=>`<option value="${i}"${i===edit.leagueIndex?' selected':''}>${escapeHtml(compactLeague(l))}</option>`).join('')}</select>
      <input id="manual-history-place" class="manual-history-input" maxlength="6" placeholder="Platz" value="${escapeHtml(edit.place||'')}">
      <div class="manual-history-checks"><label><input type="checkbox" id="manual-history-promotion"${edit.promotion?' checked':''}> Aufstieg</label><label><input type="checkbox" id="manual-history-relegation"${edit.relegation?' checked':''}> Abstieg</label></div>
      <div class="manual-history-actions"><button id="manual-history-save" class="manual-history-save is-editing" type="button">Speichern</button><button id="manual-history-cancel" class="manual-history-cancel" type="button">Abbrechen</button></div>
    </div>`;
  }
  function renderHistoryList(){
    const rows=visibleRows();
    if((state.spread||0)===0) return '<div class="manual-history-empty">Historie startet ab Saison 2</div>';
    if(!rows.length) return '<div class="manual-history-empty">Noch keine Historie gespeichert</div>';
    let html='<div class="manual-history-list">';
    rows.forEach(e=>{
      const cls=e.promotion?' is-promotion':(e.relegation?' is-relegation':'');
      const badge=e.promotion?'Aufstieg':(e.relegation?'Abstieg':'');
      const place=e.place||'—';
      html+=`<div class="manual-history-group-year">Saison ${escapeHtml(e.season||seasonLabelSafe(e.resultSeasonIndex))}</div>`;
      html+=`<div class="manual-history-entry${cls}" data-history-entry="${e.id}"><span class="manual-history-entry-league" title="${escapeHtml(compactLeague(HISTORY_LEAGUES[e.leagueIndex]||'Liga'))}">${escapeHtml(compactLeague(HISTORY_LEAGUES[e.leagueIndex]||'Liga'))}</span><span class="manual-history-entry-place">${escapeHtml(place)}</span><button class="manual-history-edit" data-history-edit="${e.id}" type="button" title="Eintrag bearbeiten"><i class="ti ti-pencil"></i></button>${badge?`<span class="manual-history-badge">${badge}</span>`:''}</div>`;
    });
    return html+'</div>';
  }
  function renderHistoryPanel(){
    oneEntryPerPastSeason();
    return `<div class="league-panel manual-history-panel final-season-history album-bound-history"><div class="manual-history-head"><div class="manual-history-title">Liga-Historie</div></div>${renderHistoryForm()}${renderHistoryList()}</div>`;
  }
  function bindHistoryPanel(){
    document.querySelectorAll('.league-panel').forEach(p=>p.remove());
    const shell=document.querySelector('.app-shell');
    if(!shell) return;
    shell.insertAdjacentHTML('beforeend',renderHistoryPanel());
    const cancel=document.getElementById('manual-history-cancel');
    if(cancel) cancel.onclick=()=>setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});
    const place=document.getElementById('manual-history-place');
    if(place) place.oninput=()=>{place.value=place.value.replace(/[^0-9.]/g,'').slice(0,6)};
    const promo=document.getElementById('manual-history-promotion'), releg=document.getElementById('manual-history-relegation');
    if(promo&&releg){promo.onchange=()=>{if(promo.checked)releg.checked=false};releg.onchange=()=>{if(releg.checked)promo.checked=false};}
    const save=document.getElementById('manual-history-save');
    if(save) save.onclick=()=>{
      oneEntryPerPastSeason();
      const entry=state.leagueHistoryEntries.find(e=>String(e.id)===String(state.editLeagueHistoryId));
      if(!entry) return;
      entry.leagueIndex=Math.max(0,Math.min(HISTORY_LEAGUES.length-1,parseInt((document.getElementById('manual-history-league')||{}).value||'0',10)||0));
      entry.place=((document.getElementById('manual-history-place')||{}).value||'').trim();
      entry.promotion=!!(document.getElementById('manual-history-promotion')||{}).checked;
      entry.relegation=!!(document.getElementById('manual-history-relegation')||{}).checked;
      entry.season=seasonLabelSafe(entry.resultSeasonIndex);
      setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});
      saveState();
    };
    document.querySelectorAll('[data-history-edit]').forEach(btn=>{
      btn.onclick=e=>{e.preventDefault();e.stopPropagation();setState({showLeagueHistoryForm:true,editLeagueHistoryId:+btn.dataset.historyEdit});};
    });
  }

  const prevSave=saveState;
  saveState=async function(){oneEntryPerPastSeason();await prevSave();try{await storageSet(HISTORY_STORAGE_KEY,JSON.stringify({leagueHistoryEntries:state.leagueHistoryEntries||[],marker:'album-bound-pencil-history-v1'}));}catch(e){}};
  const prevLoad=loadState;
  loadState=async function(){await prevLoad();try{const raw=await storageGet(HISTORY_STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.leagueHistoryEntries))state.leagueHistoryEntries=d.leagueHistoryEntries;}}catch(e){}oneEntryPerPastSeason();render();};
  const prevAttach=attachListeners;
  attachListeners=function(){prevAttach();bindHistoryPanel();};
  try{oneEntryPerPastSeason();if(state.loaded)render();}catch(e){}
})();

  function updateEntryFromControls(id){
    ensureHistoryEntries();
    const entry=state.leagueHistoryEntries.find(e=>String(e.id)===String(id));
    if(!entry) return;
    const league=document.querySelector(`[data-history-league="${id}"]`);
    const place=document.querySelector(`[data-history-place="${id}"]`);
    const promo=document.querySelector(`[data-history-promotion="${id}"]`);
    const releg=document.querySelector(`[data-history-relegation="${id}"]`);
    entry.leagueIndex=Math.max(0,Math.min(HISTORY_LEAGUES.length-1,parseInt((league||{}).value||'0',10)||0));
    entry.place=String((place||{}).value||'').trim();
    entry.promotion=!!(promo||{}).checked;

  function bindHistoryPanel(){
    document.querySelectorAll('.league-panel').forEach(p=>p.remove());
    const shell=document.querySelector('.app-shell');
    if(!shell) return;
    shell.insertAdjacentHTML('beforeend',renderHistoryPanel());
    document.querySelectorAll('[data-history-edit]').forEach(btn=>{
      btn.onclick=e=>{e.preventDefault();e.stopPropagation();setState({editLeagueHistoryId:+btn.dataset.historyEdit,showLeagueHistoryForm:false});};

    document.querySelectorAll('[data-history-save]').forEach(btn=>{

    document.querySelectorAll('[data-history-league]').forEach(sel=>{
      sel.onchange=()=>{updateEntryFromControls(sel.dataset.historyLeague);persistHistoryNow();};
    });
    document.querySelectorAll('[data-history-promotion]').forEach(ch=>{
      ch.onchange=()=>{const id=ch.dataset.historyPromotion;const other=document.querySelector(`[data-history-relegation="${id}"]`);if(ch.checked&&other)other.checked=false;updateEntryFromControls(id);persistHistoryNow().then(()=>setState({editLeagueHistoryId:+id}));};
    });
    document.querySelectorAll('[data-history-relegation]').forEach(ch=>{
      ch.onchange=()=>{const id=ch.dataset.historyRelegation;const other=document.querySelector(`[data-history-promotion="${id}"]`);if(ch.checked&&other)other.checked=false;updateEntryFromControls(id);persistHistoryNow().then(()=>setState({editLeagueHistoryId:+id}));};
    });
  }

  const previousSave=saveState;
  saveState=async function(){ensureHistoryEntries();await previousSave();try{await storageSet(HISTORY_STORAGE_KEY,JSON.stringify({leagueHistoryEntries:state.leagueHistoryEntries||[],marker:'inline-history-autosave-v1'}));}catch(e){}};
  const previousLoad=loadState;
  loadState=async function(){await previousLoad();try{const raw=await storageGet(HISTORY_STORAGE_KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.leagueHistoryEntries))state.leagueHistoryEntries=d.leagueHistoryEntries;}}catch(e){}ensureHistoryEntries();render();};
  const previousAttach=attachListeners;
  attachListeners=function(){previousAttach();bindHistoryPanel();};
  try{ensureHistoryEntries();if(state.loaded)render();}catch(e){}
})();

  function parseCSV(text){
    const rows=[];let row=[],cell='',q=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i], nx=text[i+1];
      if(q){if(ch==='"'&&nx==='"'){cell+='"';i++;}else if(ch==='"'){q=false;}else cell+=ch;}
      else{if(ch==='"')q=true;else if(ch===','||ch===';'){row.push(cell);cell='';}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}else if(ch!=='\r')cell+=ch;}
    }
    if(cell||row.length){row.push(cell);rows.push(row);}
    if(rows.length<2)return[];
    const headers=rows[0].map(h=>String(h||'').trim());
    return rows.slice(1).filter(r=>r.some(v=>String(v||'').trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));
  }
  function parseImportText(text,filename){
    const trimmed=String(text||'').trim();
    if(!trimmed)return[];
    const flattenPlayers=(data)=>{
      const out=[];
      const pushMany=(value,sourceKey)=>{
        flattenPlayers(value).forEach(item=>{
          if(sourceKey && item && typeof item==='object' && !item.name)item.name=sourceKey;
          out.push(item);
        });
      };
      if(!data)return out;
      if(Array.isArray(data)){data.forEach(item=>pushMany(item));return out;}
      if(typeof data==='object'){
        const directLists=['players','player','spieler','stickers','kader','roster','squad','team'];
        for(const key of directLists){
          if(Array.isArray(data[key])){data[key].forEach(item=>pushMany(item));return out;}
        }
        if(data.player&&typeof data.player==='object')return flattenPlayers(data.player);
        if(data.spieler&&typeof data.spieler==='object')return flattenPlayers(data.spieler);
        if(data.name||data.position||data.attrs||data.careerHistory){out.push(data);return out;}
        const values=Object.entries(data).filter(([_,v])=>v&&typeof v==='object');
        if(values.length){
          values.forEach(([k,v])=>pushMany(v,k));
          return out;
        }
      }
      return out;
    };
    if(/\.json$/i.test(filename||'')||/\.jsonl$/i.test(filename||'')||trimmed[0]==='{'||trimmed[0]==='['){
      let data;
      try{
        data=JSON.parse(trimmed);
      }catch(e){
        const lines=trimmed.split(/\n+/).map(x=>x.trim()).filter(Boolean);
        if(lines.length>1){
          const all=[];
          lines.forEach(line=>{flattenPlayers(JSON.parse(line)).forEach(x=>all.push(x));});
          return all;
        }
        throw e;
      }
      const players=flattenPlayers(data);
      if(players.length)return players;
      throw new Error('JSON muss ein Spieler-Array, ein einzelnes Spieler-Objekt, {"players":[...]}, {"roster":[...]} oder ein Objekt mit Spieler-Namen als Keys enthalten.');
    }
    return parseCSV(trimmed);
  }
  function playerNameKey(name){return String(name||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');} 
  function findExistingStickerByName(name){
    const key=playerNameKey(name);
    if(!key)return null;
    const sp=currentSpread();
    for(const c of CATEGORIES){
      const arr=sp.categories?.[c.id]||[];
      for(let i=0;i<arr.length;i++){
        const s=arr[i];
        if(s&&playerNameKey(s.name)===key)return{sticker:s,arr,index:i,scope:'current'};
      }
    }
    if(Array.isArray(state.awards)&&state.awards[state.spread]?.featured){
      const featured=state.awards[state.spread].featured;
      for(const k of Object.keys(featured)){
        const s=featured[k];
        if(s&&playerNameKey(s.name)===key)return{sticker:s,awardKey:k,scope:'currentAward'};
      }
    }
    for(let i=0;i<(state.stickerArchive||[]).length;i++){
      const s=state.stickerArchive[i];
      if(s&&playerNameKey(s.name)===key)return{sticker:s,arr:state.stickerArchive,index:i,scope:'archive'};
    }
    return null;
  }
  function cloneImportedCardForCurrentSeason(sticker){
    const clone=copyImportSticker(sticker);

    return clone;
  }
  function replaceCurrentSeasonCopiesByName(sticker){
    const key=playerNameKey(sticker&&sticker.name);
    if(!key)return 0;
    let count=0;
    const sp=currentSpread();
    CATEGORIES.forEach(c=>{
      const arr=sp.categories?.[c.id]||[];
      for(let i=0;i<arr.length;i++){
        const old=arr[i];
        if(old&&playerNameKey(old.name)===key){arr[i]=copyImportSticker({...old,...sticker,id:old.id,stickerNo:old.stickerNo||sticker.stickerNo});count++;}
      }
    });
    if(Array.isArray(state.awards)&&state.awards[state.spread]?.featured){
      const featured=state.awards[state.spread].featured;
      Object.keys(featured).forEach(k=>{
        const old=featured[k];
        if(old&&playerNameKey(old.name)===key){featured[k]=copyImportSticker({...old,...sticker,id:old.id,stickerNo:old.stickerNo||sticker.stickerNo});count++;}
      });
    }
    return count;
  }
  function mergeCareerHistory(oldRows,newRows){
    const out=Array.isArray(oldRows)?oldRows.slice():[];
    (Array.isArray(newRows)?newRows:[]).forEach(row=>{
      const key=String(row.year||row.type||'').trim().toLowerCase();
      const i=key?out.findIndex(r=>String(r.year||r.type||'').trim().toLowerCase()===key):-1;
      if(i>=0)out[i]={...out[i],...row}; else out.push(row);
    });
    return out;
  }
  function mergeImportedSticker(existing,incoming){
    const merged={...(existing||{})};
    Object.entries(incoming||{}).forEach(([k,v])=>{
      if(k==='id'||k==='stickerNo')return;
      if(k==='attrs'){if(v&&typeof v==='object'&&Object.keys(v).length)merged.attrs={...(merged.attrs||{}),...v};return;}
      if(k==='careerHistory'){if(Array.isArray(v)&&v.length)merged.careerHistory=mergeCareerHistory(merged.careerHistory,v);return;}
      if(k==='seasonStats'){
        if(Array.isArray(v)&&v.length){
          merged.seasonStats=v;
          const incomingRows=Array.isArray(incoming.careerHistory)?incoming.careerHistory:[];
          const selected=incomingRows.find(r=>r&&r.selected&&r.year&&String(r.type||'').toLowerCase()!=='total')||incomingRows.find(r=>r&&r.year&&String(r.type||'').toLowerCase()!=='total');
          const y=String(incoming.seasonStatsYear||selected?.year||'').trim();
          if(y){
            if(!Array.isArray(merged.careerHistory))merged.careerHistory=[];
            let idx=merged.careerHistory.findIndex(r=>String(r.year||'').trim()===y && String(r.type||'').toLowerCase()!=='total');
            if(idx<0){merged.careerHistory.unshift({year:y,team:incoming.club||existing?.club||'Crewe Alexandra',nation:incoming.nationality||existing?.nationality||'England',leagueOrNation:incoming.leagueOrNation||''});idx=0;}
            merged.careerHistory[idx]={...merged.careerHistory[idx],...(selected||{}),seasonStats:v,selected:true};
          }
        }
        return;
      }
      if(v!==undefined&&v!==null&&String(v).trim()!=='')merged[k]=v;
    });
    merged.id=(existing&&existing.id)||incoming.id||state.nextId++;
    merged.stickerNo=(existing&&existing.stickerNo)||incoming.stickerNo||nextStickerNoForImport();
    return copyImportSticker(merged);
  }
  function importRecords(records){
    let imported=0, placed=0, updated=0;
    state.nextId=findImportedIdMax();
    (records||[]).forEach(original=>{
      const st=normalizeImportedRecord(original||{});
      if(!st)return;

      const finalSticker=existing?mergeImportedSticker(existing.sticker,st):st;

      if(existing&&existing.scope==='archive'&&!wantsRoster){

  }

  function extraCareerDetails(st,row){
    if(!row)return '';

    if(extras.length)bits.push(`<div class="fm-season-title" style="font-size:16px;margin-top:14px">Weitere Daten</div><div class="fm-mini-grid">${extras.map(([k,v])=>`<div class="fm-stat-box"><div class="fm-stat-label">${h(k)}</div><div class="fm-stat-value">${h(v)}</div></div>`).join('')}</div>`);

  function careerTabFull(st){
    const hist=Array.isArray(st.careerHistory)?st.careerHistory:[];
    const selectedIdx=selectedCareerIndex(st);

  function bindCareerYearClicks(){
    const st=state.profileTarget&&state.profileTarget.sticker;

    const career=document.getElementById('fm-tab-career');
    if(overview)overview.onchange=()=>{if(overview.checked)state.fmActiveTab='overview';};
    if(career)career.onchange=()=>{if(career.checked)state.fmActiveTab='career';};
    if(!st)return;
    document.querySelectorAll('[data-career-row]').forEach(row=>{
      row.onclick=()=>{
        if(!state.fmCareerSelection)state.fmCareerSelection={};
        state.fmCareerSelection[String(st.id||'')]=parseInt(row.dataset.careerRow,10)||0;
        state.fmActiveTab='career';
        setState({});
      };
    });
