  const oldAttachForStars=attachListeners;
  attachListeners=function(){oldAttachForStars();enhanceStars();bindCareerYearClicks();};
})();


// --- Patch: Foto per Zwischenablage einfuegen + kompakter Karriere-Tab nach Render ---
(function(){
  function activeIsTextInput(){
    const a=document.activeElement;
    if(!a)return false;
    const tag=(a.tagName||'').toLowerCase();
    return tag==='textarea' || tag==='input' || a.isContentEditable;
  }
  function imageFileFromClipboard(e){
    const items=e.clipboardData && e.clipboardData.items;
    if(!items)return null;
    for(let i=0;i<items.length;i++){
      const it=items[i];
      if(it && it.type && it.type.indexOf('image/')===0){
        return it.getAsFile();
      }
    }
    return null;
  }
  function setPlayerPhotoFromFile(file){
    const area=document.getElementById('photo-area');
    if(!file || !area)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      currentPhoto=ev.target.result;
      area.innerHTML='<img src="'+currentPhoto+'" style="width:100%;height:100%;object-fit:contain;object-position:center;background:var(--photo-bg)"><div class="photo-paste-hint">Bild aus Zwischenablage eingefuegt</div>';
    };
    reader.readAsDataURL(file);
  }
  function enhancePhotoPasteUI(){
    const area=document.getElementById('photo-area');
    if(!area || area.dataset.pasteReady==='1')return;
    area.dataset.pasteReady='1';
    area.setAttribute('tabindex','0');
    area.setAttribute('title','Klicken und Bild mit Strg+V / Cmd+V einfuegen oder Foto auswaehlen');
    if(!area.querySelector('img') && !area.querySelector('.photo-paste-hint')){
      area.insertAdjacentHTML('beforeend','<div class="photo-paste-hint">oder Bild mit Strg+V einfuegen</div>');
    }
    area.addEventListener('paste',function(e){
      const file=imageFileFromClipboard(e);
      if(file){e.preventDefault();setPlayerPhotoFromFile(file);}
    });
  }
  if(!window.__crewePhotoPasteBound){
    window.__crewePhotoPasteBound=true;
    document.addEventListener('paste',function(e){
      const area=document.getElementById('photo-area');
      if(!area)return;
      if(activeIsTextInput() && document.activeElement!==area)return;
      const file=imageFileFromClipboard(e);
      if(file){e.preventDefault();setPlayerPhotoFromFile(file);}
    });
  }
  const oldAttach=attachListeners;
  attachListeners=function(){
    oldAttach();
    enhancePhotoPasteUI();
  };
})();


// --- Patch: Info-Karte erweitern + Fähigkeit/Potenzial aus Spielerprofil entfernen ---
(function(){
  const style=document.createElement('style');
  style.textContent=`
    .fm-info-extra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
    .fm-info-extra-item{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:8px 9px;min-width:0}
    .fm-info-extra-item div{font-size:10px;color:#aab1c8;text-transform:uppercase;letter-spacing:.45px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fm-info-extra-item b{display:block;color:#fff;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:760px){.fm-info-extra-grid{grid-template-columns:1fr}}
  `;
  document.head.appendChild(style);

  function safe(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
  function dashLocal(v){return (v===undefined||v===null||String(v).trim()==='')?'—':String(v);}
  function sinceFromCareerLocal(st){
    try{
      if(typeof clubSinceFromCareer==='function'){
        const v=clubSinceFromCareer(st);
        if(v)return v;
      }
    }catch(e){}
    const hist=Array.isArray(st&&st.careerHistory)?st.careerHistory:[];
    const years=[];
    hist.forEach(function(r){
      const raw=String((r&&r.year)||'');
      const m=raw.match(/\d{4}/);
      if(m)years.push(parseInt(m[0],10));
    });
    if(years.length)return String(Math.min.apply(Math,years));
    return st&&st.proDebut?st.proDebut:'';
  }
  function removeAbilityPotentialFromProfileSummary(){
    const labels=document.querySelectorAll('.fm-info-row .fm-info-label');
    labels.forEach(function(label){
      const txt=(label.textContent||'').trim().toLowerCase();
      if(txt==='fähigkeit / potenzial' || txt==='faehigkeit / potenzial'){
        const row=label.closest('.fm-info-row');
        if(row)row.remove();
      }
    });
  }
  function enhanceInfoCard(){
    const target=state&&state.profileTarget;
    const st=target&&target.sticker;
    if(!st)return;
    const card=document.querySelector('.fm-info-card');
    if(!card || card.querySelector('.fm-info-extra-grid'))return;
    const after=card.querySelector('.fm-foot-mini') || card;
    const html=`<div class="fm-info-extra-grid">
      <div class="fm-info-extra-item"><div>Im Verein seit</div><b>${safe(dashLocal(sinceFromCareerLocal(st)))}</b></div>
      <div class="fm-info-extra-item"><div>Ablöse gekostet</div><b>${safe(dashLocal(st.transferFee||st.transferCost||st.feePaid||st.fee))}</b></div>
      <div class="fm-info-extra-item"><div>Profidebüt</div><b>${safe(dashLocal(st.proDebut))}</b></div>
      <div class="fm-info-extra-item"><div>Pate</div><b>${safe(dashLocal(st.patron))}</b></div>
    </div>`;
    after.insertAdjacentHTML('afterend',html);
  }
  const oldAttach=attachListeners;
  attachListeners=function(){
    oldAttach();
    removeAbilityPotentialFromProfileSummary();
    enhanceInfoCard();
  };
})();

    .manual-history-panel.user-history-panel .manual-history-delete-final{background:var(--red)!important;color:#fff!important;}

    .manual-history-panel.user-history-panel .manual-history-save.is-editing{background:#fff!important;color:var(--blue)!important;}
  `;
  document.head.appendChild(style);

  const USER_LEAGUES=['Premier League','Football League Championship','Football League One','Football League Two'];
  function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
  function compactLeague(name){return String(name||'Liga').replace(/Football League/g,'Football-League');}
  function seasonLabelLocal(i){
    try{return seasonYearText(Math.max(0,parseInt(i||0,10)||0));}
    catch(e){const y=2025+(Math.max(0,parseInt(i||0,10)||0));return `${y}/${String((y+1)%100).padStart(2,'0')}`;}
  }
  function historySeasonIndex(){return Math.max(0,(parseInt(state.spread||0,10)||0)-1);}
  function normalizeUserHistory(){
    if(!Array.isArray(state.leagueHistoryEntries))state.leagueHistoryEntries=[];
    state.leagueHistoryEntries=state.leagueHistoryEntries.map((e,idx)=>{
      let si=e.resultSeasonIndex;
      if(si===undefined||si===null||si==='')si=e.seasonIndex;
      si=Math.max(0,parseInt(si||0,10)||0);
      return {
        id:e.id||Date.now()+idx,
        resultSeasonIndex:si,
        seasonIndex:si,
        season:e.season||seasonLabelLocal(si),
        leagueIndex:Math.max(0,Math.min(USER_LEAGUES.length-1,parseInt(e.leagueIndex,10)||0)),
        place:String(e.place||'').trim(),
        promotion:!!e.promotion,
        relegation:!!e.relegation
      };
    }).filter(e=>e.place);
  }
  function visibleUserHistory(){
    normalizeUserHistory();
    if((state.spread||0)===0)return [];
    const max=historySeasonIndex();
    return state.leagueHistoryEntries.filter(e=>(e.resultSeasonIndex??e.seasonIndex)<=max).sort((a,b)=>((b.resultSeasonIndex??b.seasonIndex)-(a.resultSeasonIndex??a.seasonIndex))||(b.id-a.id));
  }
  function historyForm(){
    if(!state.showLeagueHistoryForm || (state.spread||0)===0)return '';
    normalizeUserHistory();
    const editId=state.editLeagueHistoryId;
    const edit=editId?state.leagueHistoryEntries.find(e=>String(e.id)===String(editId)):null;
    const li=edit?edit.leagueIndex:0;
    const pl=edit?edit.place:'';
    return `<div class="manual-history-form">
      <select id="manual-history-league" class="manual-history-select">${USER_LEAGUES.map((l,i)=>`<option value="${i}"${i===li?' selected':''}>${esc(compactLeague(l))}</option>`).join('')}</select>
      <input id="manual-history-place" class="manual-history-input" maxlength="6" placeholder="Platz" value="${esc(pl)}">
      <div class="manual-history-checks"><label><input type="checkbox" id="manual-history-promotion"${edit&&edit.promotion?' checked':''}> Aufstieg</label><label><input type="checkbox" id="manual-history-relegation"${edit&&edit.relegation?' checked':''}> Abstieg</label></div>
      <div class="manual-history-actions"><button id="manual-history-save" class="manual-history-save${edit?' is-editing':''}" type="button">${edit?'Ändern':'Speichern'}</button><button id="manual-history-cancel" class="manual-history-cancel" type="button">Abbrechen</button></div>
    </div>`;
  }
  function historyList(){
    const rows=visibleUserHistory();
    if((state.spread||0)===0)return '<div class="manual-history-empty">Historie startet ab Saison 2</div>';
    if(!rows.length)return '<div class="manual-history-empty">Noch keine Historie gespeichert</div>';
    let html='<div class="manual-history-list">', last='';
    rows.forEach(e=>{
      const season=e.season||seasonLabelLocal(e.resultSeasonIndex??e.seasonIndex??0);
      if(season!==last){html+=`<div class="manual-history-group-year">Saison ${esc(season)}</div>`;last=season;}
      const cls=e.promotion?' is-promotion':(e.relegation?' is-relegation':'');
      const badge=e.promotion?'Aufstieg':(e.relegation?'Abstieg':'');
      html+=`<div class="manual-history-entry${cls}" data-history-entry="${esc(e.id)}"><span class="manual-history-entry-league" title="${esc(compactLeague(USER_LEAGUES[e.leagueIndex]||'Liga'))}">${esc(compactLeague(USER_LEAGUES[e.leagueIndex]||'Liga'))}</span><span class="manual-history-entry-place">${esc(e.place)}</span><span class="manual-history-row-actions"><button class="manual-history-edit" data-history-edit="${esc(e.id)}" type="button" title="Eintrag ändern"><i class="ti ti-pencil"></i></button><button class="manual-history-delete-final" data-history-delete-final="${esc(e.id)}" type="button" title="Eintrag löschen"><i class="ti ti-x"></i></button></span>${badge?`<span class="manual-history-badge">${badge}</span>`:''}</div>`;
    });
    return html+'</div>';
  }
  function renderHistoryPanel(){
    normalizeUserHistory();
    const first=(state.spread||0)===0;
    const header=first?seasonLabelLocal(0):seasonLabelLocal(historySeasonIndex());
    return `<div class="league-panel manual-history-panel final-season-history user-history-panel"><div class="manual-history-head"><div class="manual-history-title">Liga-Historie</div><div class="manual-history-year">${esc(header)}</div><button id="manual-history-add" class="manual-history-add${first?' is-disabled':''}" type="button" title="Historie-Eintrag hinzufügen">+</button></div>${historyForm()}${historyList()}</div>`;
  }
  function bindUserHistoryPanel(){
    document.querySelectorAll('.league-panel').forEach(p=>p.remove());
    const shell=document.querySelector('.app-shell');
    if(!shell)return;
    shell.insertAdjacentHTML('beforeend',renderHistoryPanel());

    if(promo&&releg){promo.onchange=()=>{if(promo.checked)releg.checked=false};releg.onchange=()=>{if(releg.checked)promo.checked=false};}
    const save=document.getElementById('manual-history-save');
    if(save)save.onclick=()=>{
      normalizeUserHistory();
      const li=Math.max(0,Math.min(USER_LEAGUES.length-1,parseInt((document.getElementById('manual-history-league')||{}).value||'0',10)||0));
      const pl=((document.getElementById('manual-history-place')||{}).value||'').trim();
      if(!pl)return;
      const rsi=historySeasonIndex();

        else state.leagueHistoryEntries.push({id:Date.now(),...payload});
      }else state.leagueHistoryEntries.push({id:Date.now(),...payload});
      setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});
      saveState();
    };
    document.querySelectorAll('[data-history-edit]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();setState({showLeagueHistoryForm:true,editLeagueHistoryId:btn.dataset.historyEdit});});
    document.querySelectorAll('[data-history-delete-final]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();normalizeUserHistory();state.leagueHistoryEntries=state.leagueHistoryEntries.filter(x=>String(x.id)!==String(btn.dataset.historyDeleteFinal));setState({showLeagueHistoryForm:false,editLeagueHistoryId:null});saveState();});
  }
  const oldAttach=attachListeners;
  attachListeners=function(){oldAttach();bindUserHistoryPanel();};
  const oldSave=saveState;
  saveState=async function(){normalizeUserHistory();await oldSave();};
})();

// --- Patch: Read-only Online-Export als eigenstaendige HTML-Datei ---
(function(){
  const style=document.createElement('style');
  style.textContent=`
    .readonly-export-btn{height:42px!important;border:2px solid rgba(215,169,59,.75)!important;background:rgba(200,16,46,.86)!important;color:#fff!important;border-radius:999px!important;padding:0 15px!important;font-size:12px!important;font-weight:900!important;letter-spacing:.8px!important;text-transform:uppercase!important;cursor:pointer!important;display:inline-flex!important;align-items:center!important;gap:7px!important;box-shadow:0 6px 18px rgba(0,0,0,.22)!important;white-space:nowrap!important}
    .readonly-export-btn:hover{background:rgba(200,16,46,1)!important;transform:translateY(-1px)!important}
    body.public-view .global-add,body.public-view #add-spread-btn,body.public-view #sticker-import-btn,body.public-view #readonly-export-btn,body.public-view #delete-spread-btn,body.public-view #season-lock-toggle,body.public-view .season-lock-btn,body.public-view .slot-del,body.public-view .sticker-remove-x,body.public-view .card-remove-overlay,body.public-view .edit-icon,body.public-view .award-remove-btn,body.public-view .trophy-add-card,body.public-view .fm-profile-actions,body.public-view .delete-btn,body.public-view .edit-action-btn,body.public-view .parking-add,body.public-view [data-add-slot],body.public-view [data-history-edit],body.public-view [data-history-delete-final],body.public-view [data-history-delete],body.public-view .manual-history-delete,body.public-view .manual-history-add,body.public-view .manual-history-form{display:none!important}
    body.public-view .slot-empty,body.public-view .parking-empty{pointer-events:none!important;cursor:default!important}
    body.public-view .sticker-card,body.public-view .award-card,body.public-view .coach-sticker-mini{cursor:pointer!important}
    body.public-view input,body.public-view textarea,body.public-view select{pointer-events:none!important;user-select:none!important}
    body.public-view .league-row{cursor:default!important}
    body.public-view .nav-label:after{content:'Online-Ansicht';display:block;margin-top:4px;color:rgba(215,169,59,.9);font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  `;
  document.head.appendChild(style);

  function safeJson(value){
    return JSON.stringify(value).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  }
  function storageSnapshot(){
    const base={spreads:state.spreads||[],parking:state.parking||[],nextId:state.nextId||10,nextStickerNo:state.nextStickerNo||1};
    const historyPayload={leagueHistoryEntries:state.leagueHistoryEntries||[],marker:'readonly-export'};
    const map={
      'crewe-categorized-v1':JSON.stringify(base),
      'crewe-extra-v2':JSON.stringify({coach:state.coach||null,leagueSeasons:state.leagueSeasons||[]}),
      'crewe-season-pages-v1':JSON.stringify({awards:state.awards||[],seasonPage:state.seasonPage||0}),
      'crewe-sticker-archive-v2':JSON.stringify(state.stickerArchive||[]),
      'crewe-final-profile-history-v1':JSON.stringify(historyPayload),
      'crewe-league-history-v1':JSON.stringify(state.leagueHistoryEntries||[]),
      'crewe-league-history-vorsaison-v3':JSON.stringify(historyPayload),
      'crewe-auto-league-history-v1':JSON.stringify(state.autoLeagueHistory||[]),
      'crewe-auto-league-history-reset-v1':'1',
      'crewe-season-locks-v1':JSON.stringify(state.seasonLocked||[])
    };
    return map;
  }
  function fileNameForExport(){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    return `crewe-alexandra-online-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.html`;
  }
  function buildReadOnlyHtml(){
    let source='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const storage=storageSnapshot();
    const pre=`window.CREWE_PUBLIC_VIEW_ONLY=true;\nwindow.CREWE_PUBLIC_STORAGE=${safeJson(storage)};\ntry{storageGet=async function(key){return Object.prototype.hasOwnProperty.call(window.CREWE_PUBLIC_STORAGE||{},key)?window.CREWE_PUBLIC_STORAGE[key]:null;};storageSet=async function(){return;};}catch(e){}\n`;
    if(source.includes('loadState();'))source=source.replace('loadState();',pre+'loadState();');
    else source=source.replace('<\/script>',pre+'<\/script>');
    source=source.replace(/<div id="app">[\s\S]*?<\/div>\s*<script>/,'<div id="app"></div>\n<script>');
    return source;
  }
  function downloadReadOnlyExport(){
    try{if(typeof saveState==='function')saveState();}catch(e){}
    const html=buildReadOnlyHtml();
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fileNameForExport();
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function addReadOnlyExportButton(){
    if(window.CREWE_PUBLIC_VIEW_ONLY)return;
    if(document.getElementById('readonly-export-btn'))return;
    const nav=document.querySelector('.nav');
    if(!nav)return;
    const btn=document.createElement('button');
    btn.id='readonly-export-btn';btn.type='button';btn.className='readonly-export-btn';
    btn.title='Eine eingefrorene Online-Version als HTML-Datei herunterladen';
    btn.innerHTML='<i class="ti ti-world-upload"></i> Online-Export';
    btn.onclick=e=>{e.preventDefault();e.stopPropagation();downloadReadOnlyExport();};
    const importBtn=document.getElementById('sticker-import-btn');
    const addSeason=document.getElementById('add-spread-btn');
    if(importBtn&&importBtn.parentElement===nav)nav.insertBefore(btn,importBtn.nextSibling);
    else if(addSeason&&addSeason.parentElement===nav)nav.insertBefore(btn,addSeason.nextSibling);
    else nav.appendChild(btn);
  }
  function applyPublicFreeze(){
    if(!window.CREWE_PUBLIC_VIEW_ONLY)return;
    document.body.classList.add('public-view');
    document.querySelectorAll('.edit-icon,#global-add-btn,#add-spread-btn,#sticker-import-btn,#readonly-export-btn,#delete-spread-btn,#season-lock-toggle,.season-lock-btn,.sticker-remove-x,.card-remove-overlay,.slot-del,.award-remove-btn,.trophy-add-card,.parking-add,[data-add-slot],.fm-profile-actions,.edit-action-btn,.delete-btn,.manual-history-form,[data-history-edit],[data-history-delete-final],[data-history-delete],.manual-history-delete,.manual-history-add').forEach(el=>el.remove());
    document.querySelectorAll('.slot-empty,.parking-empty,[data-empty],[data-drop],[data-league-index]').forEach(el=>{el.onclick=null;el.ondrop=null;el.ondragover=null;el.ondragenter=null;el.ondragleave=null;});
    document.querySelectorAll('.sticker-card').forEach(card=>{card.setAttribute('draggable','false');card.ondragstart=null;card.ondragend=null;});
    document.querySelectorAll('input,textarea,select').forEach(el=>{el.setAttribute('readonly','readonly');el.setAttribute('tabindex','-1');});
  }
  const prevAttach=attachListeners;
  attachListeners=function(){prevAttach();addReadOnlyExportButton();applyPublicFreeze();};
  if(window.CREWE_PUBLIC_VIEW_ONLY){applyPublicFreeze();setTimeout(applyPublicFreeze,60);setTimeout(applyPublicFreeze,250);}else{addReadOnlyExportButton();}
})();
